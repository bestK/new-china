<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A PAPER EPIC / 一纸山河</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, "Times New Roman", serif;
  }

  body.cursor-hidden {
    cursor: none;
  }

  #viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    overflow: hidden;
    background: #14110e;
    transform-origin: center center;
  }

  #epic-canvas {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    display: block;
  }

  #paper-vignette-layer {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    display: block;
  }

  /* Minimalist recording-friendly HUD (bottom-left) — zero backdrop-filter GPU readback */
  #hud {
    position: absolute;
    left: 34px;
    bottom: 28px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 15px 9px 12px;
    border-radius: 3px;
    background: rgba(14, 12, 10, 0.84);
    border: 1px solid rgba(235, 214, 174, 0.24);
    color: #efe5cf;
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
    pointer-events: auto;
  }

  #hud.hud-hidden {
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    pointer-events: none;
  }

  .hud-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #efe5cf;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 2px;
    opacity: 0.86;
    transition: opacity 0.18s ease, background 0.18s ease, color 0.18s ease;
  }

  .hud-btn:hover {
    opacity: 1;
    background: rgba(239, 229, 207, 0.12);
  }

  .hud-btn.active {
    color: #f0c76e;
    opacity: 1;
  }

  .hud-btn.audio-pending {
    color: #f0c76e;
    opacity: 0.95;
  }

  .hud-btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }

  #timeline-wrap {
    position: relative;
    width: 288px;
    height: 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  #timeline-track {
    position: relative;
    width: 100%;
    height: 3px;
    background: rgba(239, 229, 207, 0.22);
    border-radius: 2px;
  }

  #timeline-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d89b42, #f2cc76);
    border-radius: 2px;
  }

  #timeline-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: #f6e7c4;
  }

  .chapter-tick {
    position: absolute;
    top: -4px;
    width: 1px;
    height: 11px;
    background: rgba(239, 229, 207, 0.38);
    pointer-events: none;
  }

  #timecode {
    font-family: "Courier New", Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: rgba(239, 229, 207, 0.88);
    min-width: 94px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="epic-canvas" width="1920" height="1080"></canvas>
    <!-- Pre-baked ONCE static paper-relief & desk-lamp vignette layer (zero per-frame blend cost!) -->
    <canvas id="paper-vignette-layer" width="960" height="540" aria-hidden="true"></canvas>

    <!-- Hidden SVG paper-relief filter definition (rasterized ONCE at startup into a fast CanvasPattern) -->
    <svg id="svg-paper-src" width="0" height="0" style="position:absolute;pointer-events:none;opacity:0" aria-hidden="true">
      <defs>
        <filter id="xuan-paper-relief" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.042 0.048" numOctaves="4" seed="49" result="fiberNoise"/>
          <feDiffuseLighting in="fiberNoise" lighting-color="#fff8e8" surfaceScale="1.9" diffuseConstant="1.08" result="rakingLight">
            <feDistantLight azimuth="225" elevation="50"/>
          </feDiffuseLighting>
          <feColorMatrix type="saturate" values="0.18"/>
        </filter>
      </defs>
    </svg>

    <audio id="epic-audio" src="assets/audio/paper-epic-dub.mp3" preload="auto"></audio>

    <div id="hud" aria-label="Playback controls">
      <button id="btn-play" class="hud-btn" title="Play / Pause (Space)" aria-label="Play or Pause">
        <svg id="icon-pause" viewBox="0 0 16 16"><rect x="3" y="2.5" width="3.5" height="11" rx="0.6"/><rect x="9.5" y="2.5" width="3.5" height="11" rx="0.6"/></svg>
        <svg id="icon-play" viewBox="0 0 16 16" style="display:none"><polygon points="4,2.2 13.5,8 4,13.8"/></svg>
      </button>
      <button id="btn-replay" class="hud-btn" title="Replay (R)" aria-label="Replay">
        <svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-4.8 2.8l1.4.8A3.9 3.9 0 1 0 8 4.1V6.3L4.4 3.5 8 .8v1.7z"/></svg>
      </button>
      <button id="btn-loop" class="hud-btn" title="Loop (L)" aria-label="Toggle Loop">
        <svg viewBox="0 0 16 16"><path d="M11.6 3.2L14 5.5l-2.4 2.3V6.3H5.2c-.8 0-1.4.6-1.4 1.4v.6H2.3v-.6a2.9 2.9 0 0 1 2.9-2.9h6.4V3.2zm-7.2 9.6L2 10.5l2.4-2.3v1.5h6.4c.8 0 1.4-.6 1.4-1.4v-.6h1.5v.6a2.9 2.9 0 0 1-2.9 2.9H4.4v1.6z"/></svg>
      </button>
      <button id="btn-mute" class="hud-btn" title="Mute / Unmute (M)" aria-label="Toggle Sound">
        <svg id="icon-vol-on" viewBox="0 0 16 16"><path d="M2.2 6v4h2.6l3.4 3V3L4.8 6H2.2zm8.2-.4a3.4 3.4 0 0 1 0 4.8l-.9-.9a2.1 2.1 0 0 0 0-3l.9-.9zm1.8-1.8a5.9 5.9 0 0 1 0 8.4l-.9-.9a4.6 4.6 0 0 0 0-6.6l.9-.9z"/></svg>
        <svg id="icon-vol-off" viewBox="0 0 16 16" style="display:none"><path d="M2.2 6v4h2.6l3.4 3V3L4.8 6H2.2zm11.9-.2l-.9-.9-1.7 1.7-1.7-1.7-.9.9L10.6 7.5 8.9 9.2l.9.9 1.7-1.7 1.7 1.7.9-.9-1.7-1.7 1.7-1.7z"/></svg>
      </button>
      <div id="timeline-wrap" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="36" aria-valuenow="0">
        <div id="timeline-track">
          <div id="timeline-fill"></div>
          <div class="chapter-tick" style="left:16.666%"></div>
          <div class="chapter-tick" style="left:33.333%"></div>
          <div class="chapter-tick" style="left:50%"></div>
          <div class="chapter-tick" style="left:66.666%"></div>
          <div class="chapter-tick" style="left:83.333%"></div>
          <div id="timeline-thumb"></div>
        </div>
      </div>
      <div id="timecode">00:00 / 00:36</div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================================
   * 1. STAGE SCALING & CONSTANTS
   * ========================================================================= */
  const W = 1920;
  const H = 1080;
  const CX = W * 0.5;
  const CY = H * 0.5;
  const FOCAL = 920;
  const TOTAL_DURATION = 36.0;
  const CAM_FPS = 24;
  const STOP_FPS = 12;

  const stageEl = document.getElementById('stage');
  const canvas = document.getElementById('epic-canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const overlayCanvas = document.getElementById('paper-vignette-layer');
  const overlayCtx = overlayCanvas.getContext('2d');

  let renderScale = 1.0;
  let perfDegraded = false;
  let engineReady = false;

  function applyRenderScale(nextScale) {
    const s = Math.round(clamp(nextScale, 0.667, 1.0) * 100) / 100;
    if (Math.abs(s - renderScale) < 0.03) return;
    renderScale = s;
    canvas.width = Math.round(W * renderScale);
    canvas.height = Math.round(H * renderScale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'low';
    if (engineReady) {
      state.lastCamFrame = -1;
      renderFrame(true);
    }
  }

  function fitStage() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    stageEl.style.transform = `scale(${scale})`;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    const target = perfDegraded ? 0.667 : clamp(scale * dpr, 0.667, 1.0);
    applyRenderScale(target);
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'low';
  window.addEventListener('resize', fitStage);

  /* =========================================================================
   * 2. DETERMINISTIC HASHING, MATH & COLOR UTILS
   * ========================================================================= */
  function hash32(a, b = 0, c = 0) {
    let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }

  function seededRand(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOutSine = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
  const easeOutBack = t => {
    const c1 = 1.35, c3 = c1 + 1;
    const x = clamp(t, 0, 1) - 1;
    return 1 + c3 * x * x * x + c1 * x * x;
  };

  function lerpColor(c1, c2, t) {
    const k = clamp(t, 0, 1);
    const r = Math.round(lerp(c1[0], c2[0], k));
    const g = Math.round(lerp(c1[1], c2[1], k));
    const b = Math.round(lerp(c1[2], c2[2], k));
    return `rgb(${r},${g},${b})`;
  }

  /* =========================================================================
   * 3. PROCEDURAL PAPER TEXTURE ATLAS & PRE-BAKED SVG RELIEF TEXTURE
   * ========================================================================= */
  const PaperAtlas = {};

  function makePatternCanvas(size, drawFn) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    drawFn(g, size);
    return { canvas: c, pattern: ctx.createPattern(c, 'repeat') };
  }

  function addPaperFibers(g, size, rand, count, darkCol, lightCol, grainAlpha = 0.055) {
    for (let i = 0; i < count * 2; i++) {
      const x = rand() * size;
      const y = rand() * size;
      const r = 1 + rand() * 3.2;
      g.fillStyle = rand() > 0.5 ? darkCol : lightCol;
      g.globalAlpha = grainAlpha * (0.4 + rand() * 0.9);
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }
    g.lineWidth = 0.75;
    for (let i = 0; i < count; i++) {
      const x = rand() * size;
      const y = rand() * size;
      const len = 6 + rand() * 18;
      const ang = rand() * Math.PI * 2;
      const cx1 = x + Math.cos(ang + 0.4) * len * 0.5;
      const cy1 = y + Math.sin(ang + 0.4) * len * 0.5;
      const x2 = x + Math.cos(ang) * len;
      const y2 = y + Math.sin(ang) * len;
      g.strokeStyle = rand() > 0.45 ? darkCol : lightCol;
      g.globalAlpha = grainAlpha * (0.7 + rand() * 1.1);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(cx1, cy1, x2, y2);
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  function buildPaperAtlas() {
    // 1. Xuan Ivory Paper (宣纸米黄)
    PaperAtlas.xuan = makePatternCanvas(256, (g, s) => {
      const r = seededRand(101);
      g.fillStyle = '#efe4cc';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 18; i++) {
        const x = r() * s, y = r() * s, rad = 28 + r() * 64;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.5 ? 'rgba(205,180,136,0.14)' : 'rgba(255,250,238,0.16)');
        grd.addColorStop(1, 'rgba(239,228,204,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 160, '#8d7654', '#fffbf0', 0.085);
    });

    // 2. Aged 1949 Broadsheet Newsprint (泛黄旧报纹)
    PaperAtlas.newsprint = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1949);
      g.fillStyle = '#dfd1b3';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 22; i++) {
        const x = r() * s, y = r() * s, rad = 18 + r() * 52;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, 'rgba(164,132,84,0.16)');
        grd.addColorStop(1, 'rgba(223,209,179,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      g.strokeStyle = 'rgba(54,44,34,0.14)';
      g.lineWidth = 1;
      for (let x = 16; x < s; x += 64) {
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, s); g.stroke();
      }
      g.fillStyle = 'rgba(42,35,28,0.18)';
      for (let col = 0; col < 4; col++) {
        const cx0 = 22 + col * 64;
        for (let row = 6; row < s; row += 8) {
          if (r() < 0.14) continue;
          g.fillRect(cx0, row, 36 + r() * 14, 2.2);
        }
      }
      addPaperFibers(g, s, r, 150, '#6e5a3e', '#f5ebd6', 0.09);
    });

    // 3. Cinnabar Woodblock Red (朱砂红)
    PaperAtlas.cinnabar = makePatternCanvas(256, (g, s) => {
      const r = seededRand(203);
      g.fillStyle = '#b73226';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 90; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(130,22,16,0.14)' : 'rgba(232,102,72,0.11)';
        g.fillRect(0, r() * s, s, 1 + r() * 3.5);
      }
      addPaperFibers(g, s, r, 140, '#5d140e', '#f4c7a8', 0.08);
    });

    // 4. Harvest Ochre / Woodcut Gold (复古赭石麦金)
    PaperAtlas.ochre = makePatternCanvas(256, (g, s) => {
      const r = seededRand(304);
      g.fillStyle = '#d4993a';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 45; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(155,96,24,0.12)' : 'rgba(255,228,154,0.14)';
        g.fillRect(r() * s, r() * s, 16 + r() * 48, 2 + r() * 5);
      }
      addPaperFibers(g, s, r, 130, '#7c4c12', '#fff0be', 0.085);
    });

    // 5. Prussian Cyanotype Blueprint (蓝图晒图肌理)
    PaperAtlas.blueprint = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1956);
      g.fillStyle = '#1c3e5b';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 24; i++) {
        const x = r() * s, y = r() * s, rad = 24 + r() * 70;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.45 ? 'rgba(42,98,138,0.22)' : 'rgba(14,32,52,0.22)');
        grd.addColorStop(1, 'rgba(28,62,91,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      g.strokeStyle = 'rgba(218,236,248,0.11)';
      g.lineWidth = 0.7;
      for (let i = 0; i < s; i += 16) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke();
      }
      g.strokeStyle = 'rgba(232,245,255,0.23)';
      g.lineWidth = 1;
      for (let i = 0; i < s; i += 64) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke();
      }
      addPaperFibers(g, s, r, 130, '#0c1f30', '#cce5f5', 0.065);
    });

    // 6. Industrial Steel Slate Paper (钢铁灰)
    PaperAtlas.steel = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1958);
      g.fillStyle = '#5b6873';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 70; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(30,38,46,0.14)' : 'rgba(180,194,206,0.12)';
        g.fillRect(0, r() * s, s, 1 + r() * 3);
      }
      addPaperFibers(g, s, r, 130, '#2a333b', '#ced9e2', 0.075);
    });

    // 7. Oxide Industrial Rust Paper (红砖铁锈)
    PaperAtlas.rust = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1962);
      g.fillStyle = '#994c34';
      g.fillRect(0, 0, s, s);
      addPaperFibers(g, s, r, 140, '#4f2114', '#e3a588', 0.09);
    });

    // 8. Raw Cotton Tissue Paper (棉纸白)
    PaperAtlas.cotton = makePatternCanvas(256, (g, s) => {
      const r = seededRand(405);
      g.fillStyle = '#f6f2e8';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 24; i++) {
        const x = r() * s, y = r() * s, rad = 16 + r() * 44;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, 'rgba(218,208,190,0.18)');
        grd.addColorStop(1, 'rgba(246,242,232,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 180, '#b5a892', '#ffffff', 0.09);
    });

    // 9. Celestial Star-Chart Indigo (星穹深蓝)
    PaperAtlas.cosmic = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1970);
      g.fillStyle = '#0e1e36';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 20; i++) {
        const x = r() * s, y = r() * s, rad = 32 + r() * 75;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.5 ? 'rgba(30,66,112,0.22)' : 'rgba(6,13,26,0.26)');
        grd.addColorStop(1, 'rgba(14,30,54,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 120, '#050b16', '#4a709e', 0.065);
    });

    // 10. Hot-Stamped Gold Foil (烫金箔 — seamless tileable)
    PaperAtlas.goldFoil = makePatternCanvas(256, (g, s) => {
      const r = seededRand(777);
      const grd = g.createLinearGradient(0, 0, s, 0);
      grd.addColorStop(0, '#dfb04c');
      grd.addColorStop(0.25, '#f6dc91');
      grd.addColorStop(0.5, '#cf9935');
      grd.addColorStop(0.75, '#f8e3a1');
      grd.addColorStop(1, '#dfb04c');
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 110; i++) {
        g.strokeStyle = r() > 0.5 ? 'rgba(255,250,224,0.16)' : 'rgba(116,74,14,0.12)';
        g.lineWidth = 0.8 + r() * 1.4;
        const y = r() * s;
        g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke();
      }
      addPaperFibers(g, s, r, 70, '#8d5b14', '#fff5d0', 0.06);
    });

    // 11. Brushed Silver Foil (银箔纸 — seamless tileable)
    PaperAtlas.silverFoil = makePatternCanvas(256, (g, s) => {
      const r = seededRand(888);
      const grd = g.createLinearGradient(0, 0, s, 0);
      grd.addColorStop(0, '#cfd8e1');
      grd.addColorStop(0.3, '#edf2f7');
      grd.addColorStop(0.6, '#b7c4d0');
      grd.addColorStop(0.85, '#e5ebf1');
      grd.addColorStop(1, '#cfd8e1');
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
      addPaperFibers(g, s, r, 100, '#6e7c8a', '#ffffff', 0.075);
    });

    // 12. Celadon Mineral Ink-Wash (青绿山水纸 — seamless tileable)

  /* =========================================================================
   * 4. PAPERCRAFT DRAWING PRIMITIVES & PRE-BAKED SHADOW / DOF SPRITE BUILDERS
   * ========================================================================= */
  function buildDeckledPoints(pts, seed = 1, step = 10, amp = 2.6, closed = true) {
    const out = [];
    const n = pts.length;
    const count = closed ? n : n - 1;
    let idx = 0;
    for (let i = 0; i < count; i++) {
      const p0 = pts[i];
      const p1 = pts[(i + 1) % n];
      const dx = p1[0] - p0[0];
      const dy = p1[1] - p0[1];
      const dist = Math.hypot(dx, dy);
      const segs = Math.max(1, Math.round(dist / step));
      const nx = dist > 0.001 ? -dy / dist : 0;
      const ny = dist > 0.001 ? dx / dist : 0;
      for (let j = 0; j < segs; j++) {
        const f = j / segs;
        const j1 = (hash32(seed, idx++, 11) * 2 - 1) * amp;
        const j2 = (hash32(seed, idx, 23) * 2 - 1) * amp * 0.45;
        const edgePin = (j === 0) ? 0.3 : 1.0;
        out.push([
          p0[0] + dx * f + nx * (j1 + j2) * edgePin,
          p0[1] + dy * f + ny * (j1 + j2) * edgePin
        ]);
      }
    }
    if (!closed && n > 0) out.push(pts[n - 1]);
    return out;
  }

  function tracePoly(g, pts, closed = true) {
    if (!pts.length) return;
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    if (closed) g.closePath();
  }

  function fillDeckledPoly(g, pts, opts = {}) {
    const {
      fill = PaperAtlas.xuan.pattern,
      pulpColor = 'rgba(247, 240, 224, 0.85)',
      pulpWidth = 3.2,
      rimLight = 'rgba(255, 249, 232, 0.28)',
      strokeColor = null,
      strokeWidth = 1.2,
      seed = 7,
      step = 11,
      amp = 2.6,
      tint = null,
      innerShadow = true
    } = opts;

    const dPts = buildDeckledPoints(pts, seed, step, amp, true);

    if (pulpWidth > 0) {
      g.save();
      tracePoly(g, dPts, true);
      g.strokeStyle = pulpColor;
      g.lineWidth = pulpWidth * 2;
      g.lineJoin = 'round';
      g.stroke();
      g.restore();
    }

    g.save();
    tracePoly(g, dPts, true);
    g.fillStyle = fill;
    g.fill();
    if (tint) {
      g.fillStyle = tint;
      g.fill();
    }
    if (innerShadow) {
      g.clip();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of dPts) {
        if (p[0] < minX) minX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] > maxY) maxY = p[1];
      }
      const grd = g.createLinearGradient(minX, minY, maxX, maxY);
      grd.addColorStop(0, 'rgba(255, 248, 228, 0.14)');
      grd.addColorStop(0.5, 'rgba(255, 248, 228, 0.0)');
      grd.addColorStop(1, 'rgba(18, 12, 8, 0.18)');
      g.fillStyle = grd;
      g.fillRect(minX - 4, minY - 4, maxX - minX + 8, maxY - minY + 8);
    }
    g.restore();

    if (rimLight) {
      g.save();
      g.translate(-1, -1);
      tracePoly(g, dPts, true);
      g.strokeStyle = rimLight;
      g.lineWidth = 1.1;
      g.stroke();
      g.restore();
    }

    if (strokeColor) {
      g.save();
      tracePoly(g, dPts, true);
      g.strokeStyle = strokeColor;
      g.lineWidth = strokeWidth;
      g.stroke();
      g.restore();
    }
    return dPts;
  }

  // Ultra-fast Pre-Baked Shadow & Optical Soft-Focus Twin Factory!
  // Zero ctx.shadowBlur & zero ctx.filter during live animation = 40x faster on Windows Chrome!
  function buildShadowCanvas(src, blurPx = 5.5, color = 'rgba(14, 9, 5, 0.46)') {
    const scale = Math.min(0.28, 420 / Math.max(src.width, src.height, 420));
    const sw = Math.max(8, Math.ceil(src.width * scale));
    const sh = Math.max(8, Math.ceil(src.height * scale));
    const pad = Math.ceil(blurPx * 2.6);

    const sil = document.createElement('canvas');
    sil.width = sw;
    sil.height = sh;
    const sg = sil.getContext('2d');
    sg.drawImage(src, 0, 0, sw, sh);
    sg.globalCompositeOperation = 'source-in';
    sg.fillStyle = color;
    sg.fillRect(0, 0, sw, sh);

    const out = document.createElement('canvas');
    out.width = sw + pad * 2;
    out.height = sh + pad * 2;
    const og = out.getContext('2d');
    og.filter = `blur(${blurPx}px)`;
    og.drawImage(sil, pad, pad);
    og.filter = 'none';

    return {
      canvas: out,
      padX: pad / scale,
      padY: pad / scale,
      fullW: out.width / scale,
      fullH: out.height / scale
    };
  }

  function buildSoftFocusCanvas(src, blurPx = 4.5) {
    const scale = 0.5;
    const sw = Math.max(8, Math.ceil(src.width * scale));
    const sh = Math.max(8, Math.ceil(src.height * scale));
    const pad = Math.ceil(blurPx * 2.5);

    const out = document.createElement('canvas');
    out.width = sw + pad * 2;
    out.height = sh + pad * 2;
    const og = out.getContext('2d');
    og.filter = `blur(${blurPx}px)`;
    og.drawImage(src, pad, pad, sw, sh);
    og.filter = 'none';

    return {
      canvas: out,
      padX: pad / scale,
      padY: pad / scale,
      fullW: out.width / scale,
      fullH: out.height / scale
    };
  }

  function makeSprite(w, h, drawFn, opts = {}) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    drawFn(g, w, h);

    const { shadow = true, shadowBlur = 5.5, shadowColor = 'rgba(14, 9, 5, 0.45)', softTwin = false } = opts;
    return {
      img: c,
      w,
      h,
      shadow: shadow ? buildShadowCanvas(c, shadowBlur, shadowColor) : null,
      soft: softTwin ? buildSoftFocusCanvas(c, 4.5) : null
    };
  }

  // Draws a pre-baked sprite with Z-dynamic pre-baked shadow & optional zero-cost soft-focus DOF!
  function drawSprite(g, sp, ox, oy, p, noShadow = false) {
    if (!noShadow && sp.shadow && p) {
      const sh = sp.shadow;
      const dx = p.shadowX / p.scale;
      const dy = p.shadowY / p.scale;
      g.drawImage(sh.canvas, ox - sh.padX + dx, oy - sh.padY + dy, sh.fullW, sh.fullH);
    }
    if (sp.soft && p && p.dofFactor > 0.08) {
      const sf = sp.soft;
      const prevA = g.globalAlpha;
      g.globalAlpha = prevA * (1 - p.dofFactor * 0.72);
      g.drawImage(sp.img, ox, oy);
      g.globalAlpha = prevA * p.dofFactor;
      g.drawImage(sf.canvas, ox - sf.padX, oy - sf.padY, sf.fullW, sf.fullH);
      g.globalAlpha = prevA;
    } else {
      g.drawImage(sp.img, ox, oy);
    }
  }

  function drawTrackedText(g, text, cx0, cy0, tracking) {
    const chars = Array.from(text);
    const widths = chars.map(ch => g.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, chars.length - 1);
    let x = cx0 - total * 0.5;
    for (let i = 0; i < chars.length; i++) {
      g.fillText(chars[i], x + widths[i] * 0.5, cy0);
      x += widths[i] + tracking;
    }
  }

    function buildGearSprite(radius, teeth, fillPat, tint) {
      const dim = Math.ceil((radius + 24) * 2);
      return makeSprite(dim, dim, (g) => {
        const cx0 = dim * 0.5;
        g.save();
        g.translate(cx0, cx0);
        const outerR = radius + 16, rootR = radius - 6, innerR = radius * 0.64, hubR = radius * 0.24;
        g.beginPath();
        for (let i = 0; i < teeth; i++) {
          const a0 = (i / teeth) * Math.PI * 2;
          const da = (Math.PI * 2) / teeth;
          const p1 = a0 + da * 0.14, p2 = a0 + da * 0.34, p3 = a0 + da * 0.64, p4 = a0 + da * 0.84;
          if (i === 0) g.moveTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
          else g.lineTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
          g.lineTo(Math.cos(p1) * outerR, Math.sin(p1) * outerR);
          g.lineTo(Math.cos(p2) * outerR, Math.sin(p2) * outerR);
          g.lineTo(Math.cos(p3) * rootR, Math.sin(p3) * rootR);
          g.lineTo(Math.cos(p4) * rootR, Math.sin(p4) * rootR);
        }
        g.closePath();
        for (let s = 0; s < 6; s++) {
          const sa0 = (s / 6) * Math.PI * 2 + 0.16;
          const sa1 = ((s + 1) / 6) * Math.PI * 2 - 0.16;
          g.moveTo(Math.cos(sa0) * innerR, Math.sin(sa0) * innerR);
          g.arc(0, 0, innerR, sa0, sa1, false);
          g.lineTo(Math.cos(sa1) * hubR, Math.sin(sa1) * hubR);
          g.arc(0, 0, hubR, sa1, sa0, true);
          g.closePath();
        }
        g.moveTo(hubR * 0.42, 0);
        g.arc(0, 0, hubR * 0.42, 0, Math.PI * 2, true);
        g.fillStyle = fillPat; g.fill('evenodd');
        if (tint) { g.fillStyle = tint; g.fill('evenodd'); }
        g.strokeStyle = 'rgba(235, 244, 252, 0.55)'; g.lineWidth = 2.2; g.stroke();
        g.fillStyle = 'rgba(236, 224, 196, 0.7)';
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          g.beginPath(); g.arc(Math.cos(a) * (radius * 0.78), Math.sin(a) * (radius * 0.78), 3.4, 0, Math.PI * 2); g.fill();
        }
        g.restore();
      });

  /* =========================================================================
   * 6. FAST 12FPS ARTICULATED RENDERERS (ZERO ctx.shadowBlur / ZERO ctx.filter)
   * ========================================================================= */
  function getStopMotionJitter(pieceId, animFrame, posScale = 1.0, rotScale = 1.0) {
    const jx = (hash32(pieceId, animFrame, 1) * 2 - 1) * 2.0 * posScale;
    const jy = (hash32(pieceId, animFrame, 2) * 2 - 1) * 2.0 * posScale;
    const jrot = (hash32(pieceId, animFrame, 3) * 2 - 1) * 0.5 * (Math.PI / 180) * rotScale;
    return { jx, jy, jrot };
  }

  function projectWorld(wx, wy, wz, cam) {
    const dz = wz - cam.z;
    if (dz <= 180 || dz >= 3600) return null;
    const scale = FOCAL / dz;
    const sx = CX + (wx - cam.x) * scale;
    const sy = CY + (wy - cam.y) * scale;

    const farFade = 1 - smoothstep(2600, 3550, dz);
    const nearFade = smoothstep(190, 340, dz);
    const alpha = farFade * nearFade;
    if (alpha <= 0.006) return null;

    // Z-depth dynamic shadow offset (down-and-right from upper-left desk lamp)
    const closeness = clamp(1 - (dz - 520) / 1400, 0.18, 1.0);
    const shadowX = lerp(5, 22, closeness) * clamp(scale, 0.45, 1.55);
    const shadowY = lerp(7, 28, closeness) * clamp(scale, 0.45, 1.55);
    const dofFactor = dz < 680 ? clamp((680 - dz) / 220, 0, 0.85) : 0;

    return { sx, sy, scale, dz, alpha, shadowX, shadowY, dofFactor };
  }

  function renderLayer(item, cam, animFrame, breathScale = 1.0) {
    const layerCam = item.cam || cam;
    const p = projectWorld(item.wx, item.wy, item.wz, layerCam);
    if (!p) return;
    const finalAlpha = p.alpha * (item.alpha ?? 1);
    if (finalAlpha <= 0.008) return;

    const posScale = (item.jitterScale ?? 0.85) * breathScale;
    const rotScale = (item.rotJitter ?? (item.wide ? 0.14 : 0.78)) * breathScale;
    const { jx, jy, jrot } = getStopMotionJitter(item.id, animFrame, posScale, rotScale);

    ctx.save();
    ctx.globalAlpha = finalAlpha;
    ctx.translate(p.sx + jx, p.sy + jy);
    ctx.rotate((item.rot ?? 0) + jrot);
    ctx.scale(p.scale * (item.scaleX ?? 1), p.scale * (item.scaleY ?? 1));
    item.draw(ctx, p);
    ctx.restore();
  }

  // Ultra-fast Wheat Bank using pre-baked 4-stalk clumps (10-14 blits total instead of 88!)
  function drawWheatBankFast(g, p, tObj, clumpCount, spanW, seed, flipDir = 1) {
    const sp = Sprites.wheatClump;
    for (let i = 0; i < clumpCount; i++) {
      const f = clumpCount > 1 ? i / (clumpCount - 1) : 0.5;
      const bx = (f - 0.5) * spanW;
      const sc = 0.86 + hash32(seed, i, 1) * 0.28;
      const phase = hash32(seed, i, 2) * Math.PI * 2;
      const swayAng = (Math.sin(tObj * 2.4 + phase) * 0.085 * flipDir) + Math.sin(tObj * 1.1 + f * 5) * 0.04;
      g.save();
      g.translate(bx, 18);
      g.rotate(swayAng);
      g.scale(sc * flipDir, sc);
      drawSprite(g, sp, -170, -420, p, false);
      g.restore();
    }
  }

    g.save();

  // Dongfanghong-1 Polyhedron Satellite with cheap soft radial shadow
  function drawDongfanghongFast(g, p, tObj) {
    const R = 64, spin = tObj * 0.9;
    // Soft Z-offset paper shadow underneath satellite
    const dx = p.shadowX / p.scale, dy = p.shadowY / p.scale;
    const sg = g.createRadialGradient(dx, dy, 10, dx, dy, R * 1.32);
    sg.addColorStop(0, 'rgba(4, 10, 24, 0.56)'); sg.addColorStop(1, 'rgba(4, 10, 24, 0)');
    g.fillStyle = sg; g.beginPath(); g.arc(dx, dy, R * 1.32, 0, Math.PI * 2); g.fill();

    // 4 whip antennas
    g.strokeStyle = '#eef4fa'; g.lineWidth = 3.2;
    for (let i = 0; i < 4; i++) {
      const a = spin * 0.35 + (i * Math.PI * 0.5) + 0.42;
      g.beginPath(); g.moveTo(Math.cos(a) * R * 0.8, Math.sin(a) * R * 0.8); g.lineTo(Math.cos(a) * 178, Math.sin(a) * 178); g.stroke();
      g.fillStyle = '#f2cc70'; g.beginPath(); g.arc(Math.cos(a) * 178, Math.sin(a) * 178, 4.5, 0, Math.PI * 2); g.fill();
    }

    const outer = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + spin * 0.15;
      outer.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
    tracePoly(g, outer, true);
    g.fillStyle = PaperAtlas.silverFoil.pattern; g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 2.2; g.stroke();

    const phaseShift = (spin * 0.6) % (Math.PI / 4);
    for (let col = 0; col < 8; col++) {
      const a0 = -Math.PI * 0.5 + (col / 8) * Math.PI + phaseShift * 0.4;
      const a1 = -Math.PI * 0.5 + ((col + 1) / 8) * Math.PI + phaseShift * 0.4;
      const x0 = Math.sin(a0) * R, x1 = Math.sin(a1) * R;
      for (let row = -2; row < 2; row++) {
        const y0 = (row / 2.2) * R, y1 = ((row + 1) / 2.2) * R;
        const w0 = Math.sqrt(Math.max(0.05, 1 - (y0 / R) ** 2));
        const w1 = Math.sqrt(Math.max(0.05, 1 - (y1 / R) ** 2));
        const shade = ((col + row) % 2 === 0) ? 0.16 : -0.14;
        const lightBoost = (x0 < 0 && y0 < 0) ? 0.24 : 0;
        g.beginPath();
        g.moveTo(x0 * w0, y0); g.lineTo(x1 * w0, y0); g.lineTo(x1 * w1, y1); g.lineTo(x0 * w1, y1); g.closePath();
        g.fillStyle = (shade + lightBoost) > 0
          ? `rgba(255,252,240,${(shade + lightBoost).toFixed(2)})`
          : `rgba(22,38,60,${Math.abs(shade).toFixed(2)})`;
        g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.42)'; g.lineWidth = 1; g.stroke();
      }
    }
    g.fillStyle = PaperAtlas.goldFoil.pattern; g.fillRect(-R + 2, -6, (R - 2) * 2, 12);
    g.strokeStyle = '#ffffff'; g.lineWidth = 1.2; g.strokeRect(-R + 2, -6, (R - 2) * 2, 12);
  }

  // Fast Slewing Tower Crane with lightweight geometric cast shadow
  function drawTowerCraneFast(g, p, tObj, seed, flip = 1) {
    const slew = 0.72 + 0.28 * Math.sin(tObj * 0.9 + seed);
    const hoist = 70 + 38 * Math.sin(tObj * 1.4 + seed * 1.7);
    const jibLen = 220 * slew, counterLen = 78 * slew, tx = jibLen * 0.68;

    function drawCraneGeom(isShadow) {
      g.strokeStyle = isShadow ? 'rgba(18, 12, 8, 0.24)' : '#38464d';
      g.lineWidth = 4.5;
      g.strokeRect(-14, -360, 28, 360);
      g.lineWidth = 2.2;
      g.beginPath();
      for (let y = -360; y < 0; y += 28) {
        g.moveTo(-14, y); g.lineTo(14, y + 28);
        g.moveTo(14, y); g.lineTo(-14, y + 28);
      }
      g.stroke();
      if (!isShadow) { g.fillStyle = '#d48d36'; g.fillRect(10, -342, 26, 26); }
      g.strokeStyle = isShadow ? 'rgba(18, 12, 8, 0.24)' : '#c45232';
      g.lineWidth = 5;
      g.beginPath(); g.moveTo(-counterLen, -356); g.lineTo(jibLen, -356); g.moveTo(-counterLen, -338); g.lineTo(jibLen, -338); g.stroke();
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(0, -408); g.lineTo(jibLen * 0.88, -356); g.moveTo(0, -408); g.lineTo(-counterLen, -356);
      g.moveTo(-12, -356); g.lineTo(0, -408); g.lineTo(12, -356); g.stroke();
      g.fillStyle = isShadow ? 'rgba(18, 12, 8, 0.24)' : '#47545c';
      g.fillRect(-counterLen - 16, -356, 30, 22);
      g.strokeStyle = isShadow ? 'rgba(18, 12, 8, 0.22)' : '#2d373d';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(tx, -338); g.lineTo(tx, -338 + hoist); g.stroke();
      g.fillStyle = isShadow ? 'rgba(18, 12, 8, 0.24)' : PaperAtlas.vellum.pattern;
      g.fillRect(tx - 16, -338 + hoist, 32, 24);
    }

    g.save();
    g.scale(flip, 1);
    const dx = (p.shadowX / p.scale) * flip * 0.65, dy = (p.shadowY / p.scale) * 0.65;
    g.save(); g.translate(dx, dy); drawCraneGeom(true); g.restore();
    drawCraneGeom(false);
    g.restore();
  }

  function samplePalette(t) {
    for (let i = 0; i < PALETTE_KEYS.length - 1; i++) {
      const a = PALETTE_KEYS[i], b = PALETTE_KEYS[i + 1];
      if (t >= a.t && t <= b.t) {
        const k = easeInOutSine((t - a.t) / (b.t - a.t));
        return {
          top: lerpColor(a.top, b.top, k),
          mid: lerpColor(a.mid, b.mid, k),
          bot: lerpColor(a.bot, b.bot, k),
          relief: lerp(a.relief, b.relief, k),
          starAlpha: lerp(a.starAlpha, b.starAlpha, k)
        };
      }
    }
    const last = PALETTE_KEYS[PALETTE_KEYS.length - 1];
    return {
      top: lerpColor(last.top, last.top, 0),
      mid: lerpColor(last.mid, last.mid, 0),
      bot: lerpColor(last.bot, last.bot, 0),
      relief: last.relief,
      starAlpha: last.starAlpha
    };

  // Calm, Anti-Vertigo Multiplane Paper-Theater & Long-Scroll Camera per Chapter!
  // Replaces relentless inward tunnel zoom with varied, poised gallery camera moves:
  //   Ch1: Gentle opening push-in as newspapers part
  //   Ch2: Smooth horizontal left-to-right tracking pan following the steam locomotive
  //   Ch3: Upward blueprint page-peel + serene slight diagonal drift across star chart

  //   Ch5: True Chinese long-scroll (长卷) horizontal glide across sea bridge & green mountains
  //   Ch6: Gentle ascent through parting clouds into the tranquil cosmic finale
  function getChapterCam(chIdx, tCam) {
    const lt = tCam - chIdx * 6.0;
    const u = clamp(lt / 6.0, -0.25, 1.25);
    const s = easeInOutSine(clamp(lt / 6.0, 0, 1));

    switch (chIdx) {
      case 0: {
        const exitShift = smoothstep(5.0, 6.2, tCam) * 65;
        return { x: 0, y: 0, z: s * 125 + exitShift };
      }
      case 1: {
        const enterX = (1 - easeOutCubic(smoothstep(5.2, 6.6, tCam))) * -140;
        return { x: lerp(-95, 85, s) + enterX, y: 0, z: s * 78 };
      }
      case 2: {
        const exitUp = smoothstep(17.0, 18.4, tCam) * 380;
        return { x: lerp(-45, 45, s), y: lerp(22, -22, s) + exitUp, z: s * 82 };
      }
      case 3: {
        const enterDown = (1 - easeOutCubic(smoothstep(17.1, 18.8, tCam))) * -360;
        const exitScroll = smoothstep(23.1, 24.4, tCam) * 580;
        return { x: lerp(-55, 55, s) + exitScroll, y: enterDown, z: s * 68 };
      }
      case 4: {
        const enterScroll = (1 - easeOutCubic(smoothstep(23.2, 24.7, tCam))) * -560;
        const exitDown = smoothstep(29.2, 30.8, tCam) * -420;
        return { x: lerp(-105, 105, s) + enterScroll, y: exitDown, z: s * 72 };
      }
      default: {
        const enterUp = (1 - easeOutCubic(smoothstep(29.3, 32.0, tCam))) * 340;
        const zEase = easeOutCubic(clamp((tCam - 30.0) / 5.0, 0, 1));
        return { x: 0, y: enterUp, z: zEase * 88 };
      }
    }
  }

          rot: -0.16 + stOrbit * 0.035,
          draw: (g, p) => drawSprite(g, Sprites.tiangong, -430, -220, p)
        });

        layers.push({
          id: 6040, wx: 0, wy: 430, wz: 1240, alpha: ch6Alpha, wide: true,
          draw: (g, p) => drawSprite(g, Sprites.epicRangeBack, -1800, -390, p)
        });
        layers.push({
          id: 6042, wx: Math.sin(tObj * 0.18) * 14, wy: 470, wz: 1115, alpha: ch6Alpha, wide: true,
          draw: (g, p) => drawSprite(g, Sprites.epicRangeFront, -1800, -270, p)
        });

        layers.push({
          id: 6044, wx: -460 + Math.sin(tObj * 0.25) * 32, wy: 375, wz: 1080, alpha: ch6Alpha * 0.34, jitterScale: 0.25, wide: true,
          draw: g => {
            const mg = g.createRadialGradient(0, 0, 40, 0, 0, 620);
            mg.addColorStop(0, 'rgba(220, 232, 236, 0.55)'); mg.addColorStop(0.55, 'rgba(182, 206, 218, 0.20)'); mg.addColorStop(1, 'rgba(182, 206, 218, 0)');
            g.fillStyle = mg; g.beginPath(); g.ellipse(0, 0, 640, 95, 0, 0, Math.PI * 2); g.fill();
          }
        });
        layers.push({
          id: 6045, wx: 500 - Math.sin(tObj * 0.24) * 28, wy: 390, wz: 1070, alpha: ch6Alpha * 0.30, jitterScale: 0.25, wide: true,
          draw: g => {
            const mg = g.createRadialGradient(0, 0, 40, 0, 0, 580);
            mg.addColorStop(0, 'rgba(220, 232, 236, 0.52)'); mg.addColorStop(0.55, 'rgba(182, 206, 218, 0.18)'); mg.addColorStop(1, 'rgba(182, 206, 218, 0)');
            g.fillStyle = mg; g.beginPath(); g.ellipse(0, 0, 600, 88, 0, 0, Math.PI * 2); g.fill();
          }
        });
      });
    }

    return stages;
  }

  /* =========================================================================
   * 9. FAST PRE-BAKED CHAPTER TAGS & GRAND FINALE OVERLAYS
   * ========================================================================= */
  function drawChapterCornerTag(tCam, animFrame) {
    const idx = Math.min(CHAPTERS.length - 1, Math.floor(clamp(tCam, 0, 35.999) / 6));
    const ch = CHAPTERS[idx];
    const localT = tCam - ch.start;

    const fadeIn = smoothstep(0.18, 0.72, localT);
    const fadeOutEnd = idx === 5 ? 2.5 : 5.35;
    const fadeOut = 1 - smoothstep(fadeOutEnd, fadeOutEnd + 0.55, localT);
    const alpha = fadeIn * fadeOut;
    if (alpha <= 0.01) return;

    const { jx, jy, jrot } = getStopMotionJitter(9000 + idx, animFrame, 0.55);
    const slideY = (1 - easeOutCubic(fadeIn)) * 18;
    const tagSp = Sprites.chapterTags[idx];

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(56 + jx, 46 + slideY + jy);
    ctx.rotate(jrot * 0.6);
    drawSprite(ctx, tagSp, 0, 0, { scale: 1, shadowX: 6, shadowY: 8, dofFactor: 0 }, false);
    ctx.restore();
  }

  function drawGrandFinaleTitle(tCam, animFrame) {
    const reveal = smoothstep(31.8, 34.4, tCam);
    if (reveal <= 0.005) return;

    const eased = easeOutCubic(reveal);
    const { jx, jy, jrot } = getStopMotionJitter(9999, animFrame, 0.42);
    const sp = Sprites.finaleTitle;

    ctx.save();
    ctx.globalAlpha = eased;
    ctx.translate(CX + jx, CY - 32 + (1 - eased) * 24 + jy);
    ctx.rotate(jrot * 0.45);
    ctx.drawImage(sp.img, -sp.w * 0.5, -sp.h * 0.5);
    ctx.restore();
  }

  /* =========================================================================
   * 10. DUAL-FRAMERATE ENGINE (24FPS CAMERA + 12FPS STOP-MOTION) & PLAYBACK
   * ========================================================================= */
  const params = new URLSearchParams(window.location.search);
  const forcedTimeParam = params.has('t') ? parseFloat(params.get('t')) : null;
  const isInspectMode = forcedTimeParam !== null && !Number.isNaN(forcedTimeParam);

  const state = {
    playing: !isInspectMode,
    loop: false,
    muted: false,
    audioUnlocked: false,
    time: isInspectMode ? clamp(forcedTimeParam, 0, TOTAL_DURATION) : 0,
    breathTime: isInspectMode ? clamp(forcedTimeParam, 0, TOTAL_DURATION) : 0,
    lastRaf: null,
    lastCamFrame: -1,
    lastAnimFrame: -1,
    hudForceHidden: isInspectMode,
    hudVisible: !isInspectMode,
    idleTimer: null,
    scrubbing: false
  };

  const epicAudio = document.getElementById('epic-audio');
  const hudEl = document.getElementById('hud');
  const btnPlay = document.getElementById('btn-play');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const btnReplay = document.getElementById('btn-replay');
  const btnLoop = document.getElementById('btn-loop');
  const btnMute = document.getElementById('btn-mute');
  const iconVolOn = document.getElementById('icon-vol-on');
  const iconVolOff = document.getElementById('icon-vol-off');
  const timelineWrap = document.getElementById('timeline-wrap');
  const timelineFill = document.getElementById('timeline-fill');
  const timelineThumb = document.getElementById('timeline-thumb');
  const timecodeEl = document.getElementById('timecode');

  function syncAudioUi() {
    if (!btnMute) return;
    const silent = state.muted || (!state.audioUnlocked && epicAudio && epicAudio.paused && state.playing);
    iconVolOn.style.display = silent ? 'none' : 'block';
    iconVolOff.style.display = silent ? 'block' : 'none';
    btnMute.classList.toggle('audio-pending', !state.muted && !state.audioUnlocked && state.playing);
    btnMute.setAttribute('aria-pressed', String(state.muted));
  }

  function syncAudioPlayback(forceSeek = false) {
    if (isInspectMode || !epicAudio) return;
    epicAudio.muted = state.muted;
    if (state.playing && !state.scrubbing && state.time < TOTAL_DURATION - 0.04) {
      if (epicAudio.readyState >= 1) {
        const target = clamp(state.time, 0, Math.max(0, (epicAudio.duration || TOTAL_DURATION) - 0.03));
        if (forceSeek || Math.abs((epicAudio.currentTime || 0) - target) > 0.22) {
          try { epicAudio.currentTime = target; } catch (_) {}
        }
      }
      if (epicAudio.paused) {
        const p = epicAudio.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            state.audioUnlocked = true;
            syncAudioUi();
          }).catch(() => {
            state.audioUnlocked = false;
            syncAudioUi();
          });
        }
      }
    } else if (!epicAudio.paused) {
      epicAudio.pause();
    }
    syncAudioUi();
  }

  function unlockAudioFromGesture() {
    if (isInspectMode || !epicAudio || state.audioUnlocked || state.muted) return;
    syncAudioPlayback(true);
  }

  function toggleMute() {
    if (!state.audioUnlocked && !state.muted && state.playing) {
      syncAudioPlayback(true);
      wakeHud();
      return;
    }
    state.muted = !state.muted;
    syncAudioPlayback(true);
    wakeHud();
  }

  if (epicAudio) {
    epicAudio.addEventListener('loadedmetadata', () => {
      if (state.playing && !isInspectMode) syncAudioPlayback(true);
    });
    epicAudio.addEventListener('play', () => {
      state.audioUnlocked = true;
      syncAudioUi();
    });
    epicAudio.addEventListener('pause', syncAudioUi);
  }

  let lastDisplayedSec = -1;
  function syncHud(force = false) {
    const pct = (clamp(state.time, 0, TOTAL_DURATION) / TOTAL_DURATION) * 100;
    timelineFill.style.width = `${pct.toFixed(2)}%`;
    timelineThumb.style.left = `${pct.toFixed(2)}%`;
    const whole = Math.floor(clamp(state.time, 0, TOTAL_DURATION));
    if (force || whole !== lastDisplayedSec) {
      lastDisplayedSec = whole;
      timecodeEl.textContent = `00:${String(whole).padStart(2, '0')} / 00:36`;
      timelineWrap.setAttribute('aria-valuenow', String(whole));
    }
    iconPause.style.display = state.playing ? 'block' : 'none';
    iconPlay.style.display = state.playing ? 'none' : 'block';
    btnLoop.classList.toggle('active', state.loop);
    syncAudioUi();
  }

  function setHudVisibility(visible) {
    state.hudVisible = visible;
    hudEl.classList.toggle('hud-hidden', !visible);
    document.body.classList.toggle('cursor-hidden', !visible && !isInspectMode);
  }

  function scheduleHudAutoHide() {
    if (state.idleTimer) clearTimeout(state.idleTimer);
    if (state.hudForceHidden || state.scrubbing) return;
    state.idleTimer = setTimeout(() => {
      if (!state.scrubbing) setHudVisibility(false);
    }, 2000);
  }

  function wakeHud() {
    if (state.hudForceHidden) return;
    setHudVisibility(true);
    scheduleHudAutoHide();
  }

  function togglePlay() {
    if (!state.playing && state.time >= TOTAL_DURATION - 0.01) {
      state.time = 0;
      state.breathTime = 0;
    }
    state.playing = !state.playing;
    state.lastRaf = performance.now();
    syncAudioPlayback(true);
    syncHud(true);
    wakeHud();
  }

  function replay() {
    state.time = 0;
    state.breathTime = 0;
    state.playing = true;
    state.lastRaf = performance.now();
    state.lastCamFrame = -1;
    state.lastAnimFrame = -1;
    syncAudioPlayback(true);
    syncHud(true);
    wakeHud();
  }

  function toggleHudManual() {
    if (state.hudVisible) {
      state.hudForceHidden = true;
      if (state.idleTimer) clearTimeout(state.idleTimer);
      setHudVisibility(false);
    } else {
      state.hudForceHidden = false;
      setHudVisibility(true);
      scheduleHudAutoHide();
    }
  }

  function toggleLoop() {
    state.loop = !state.loop;
    syncHud(true);
    wakeHud();
  }

  function seekToClientX(clientX) {
    const rect = timelineWrap.getBoundingClientRect();
    const frac = clamp((clientX - rect.left) / rect.width, 0, 1);
    state.time = frac * TOTAL_DURATION;
    state.breathTime = state.time;
    state.lastCamFrame = -1;
    state.lastAnimFrame = -1;
    if (epicAudio && epicAudio.readyState >= 1) {
      try { epicAudio.currentTime = clamp(state.time, 0, Math.max(0, (epicAudio.duration || TOTAL_DURATION) - 0.03)); } catch (_) {}
    }
    syncHud(true);
    renderFrame(true);
  }

  btnPlay.addEventListener('click', togglePlay);
  btnReplay.addEventListener('click', replay);
  btnLoop.addEventListener('click', toggleLoop);
  btnMute.addEventListener('click', toggleMute);

  timelineWrap.addEventListener('pointerdown', e => {
    state.scrubbing = true;
    if (epicAudio && !epicAudio.paused) epicAudio.pause();
    timelineWrap.setPointerCapture(e.pointerId);
    seekToClientX(e.clientX);
    if (state.idleTimer) clearTimeout(state.idleTimer);
  });
  timelineWrap.addEventListener('pointermove', e => {
    if (state.scrubbing) seekToClientX(e.clientX);
  });
  timelineWrap.addEventListener('pointerup', e => {
    if (state.scrubbing) {
      state.scrubbing = false;
      timelineWrap.releasePointerCapture(e.pointerId);
      syncAudioPlayback(true);
      scheduleHudAutoHide();
    }
  });

  window.addEventListener('pointerdown', e => {
    if (e.target && e.target.closest && e.target.closest('#btn-mute')) return;
    unlockAudioFromGesture();
  }, { passive: true });
  window.addEventListener('mousemove', wakeHud, { passive: true });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); replay(); }
    else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); toggleHudManual(); }
    else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleLoop(); }
    else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMute(); }
    else { unlockAudioFromGesture(); }
  });

  function renderFrame(force = false) {
    const camFrame = Math.floor(state.time * CAM_FPS);
    const animFrame = Math.floor(state.breathTime * STOP_FPS);

    if (!force && camFrame === state.lastCamFrame && animFrame === state.lastAnimFrame) {
      return;
    }
    state.lastCamFrame = camFrame;
    state.lastAnimFrame = animFrame;

    const tCam = Math.min(TOTAL_DURATION, camFrame / CAM_FPS);
    const isHoldingEnd = state.time >= TOTAL_DURATION - 0.001 && !state.loop;
    const tObj = animFrame / STOP_FPS;
    const breathScale = isHoldingEnd ? 0.65 : 1.0;

    const pal = samplePalette(tCam);

    // Apply backing resolution transform cleanly in 1920x1080 logical space
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

    // 1. Backdrop sky + stars
    drawBackdrop(pal, animFrame);

    // 2. Depth-Sorted 2.5D Multiplane Papercraft Stages (calm gallery & long-scroll choreography!)
    const layers = gatherSceneLayers(tCam, tObj, animFrame);
    for (let i = 0; i < layers.length; i++) {
      renderLayer(layers[i], layers[i].cam, animFrame, breathScale);
    }

    // 3. Chapter Archival Letterpress Stamp & Grand Finale Title
    // (Paper relief + desk-lamp vignette live on the static #paper-vignette-layer with zero per-frame cost!)
    drawChapterCornerTag(tCam, animFrame);
    drawGrandFinaleTitle(tCam, animFrame);
  }

  let slowFrameStreak = 0;
  function tick(now) {
    if (state.lastRaf === null) state.lastRaf = now;
    const rawDtMs = now - state.lastRaf;
    const dt = Math.min(0.1, rawDtMs / 1000);
    state.lastRaf = now;

    // Auto-protect software/GPU-less PCs: if sustained <14fps, cleanly drop backing scale to 720p (16:9 intact)
    if (!perfDegraded && renderScale > 0.72 && state.playing && rawDtMs > 72) {
      slowFrameStreak++;
      if (slowFrameStreak >= 10) {
        perfDegraded = true;
        applyRenderScale(0.667);
      }
    } else if (rawDtMs <= 55) {
      slowFrameStreak = Math.max(0, slowFrameStreak - 1);
    }

    if (state.playing && !state.scrubbing) {
      state.breathTime += dt;
      if (state.time < TOTAL_DURATION) {
        const audioMaster = epicAudio && !epicAudio.paused && !epicAudio.ended && epicAudio.readyState >= 2 && Number.isFinite(epicAudio.duration) && epicAudio.duration > 1;
        if (audioMaster) {
          state.time = Math.min(TOTAL_DURATION, epicAudio.currentTime);
        } else {
          state.time += dt;
        }
        if (state.time >= TOTAL_DURATION - 0.015) {
          if (state.loop) {
            state.time = 0;
            state.breathTime = 0;
            syncAudioPlayback(true);
          } else {
            state.time = TOTAL_DURATION;
            if (epicAudio && !epicAudio.paused) epicAudio.pause();
          }
        }
        if (state.hudVisible) syncHud(false);
      }
    }

    renderFrame(false);
    requestAnimationFrame(tick);
  }

  /* =========================================================================
   * 11. BOOTSTRAP
   * ========================================================================= */
  fitStage();
  buildPaperAtlas();
  buildAllSprites();
  engineReady = true;
  syncHud(true);

  // Expose lightweight performance probe when ?bench=1 is passed (zero runtime impact otherwise)
  if (params.get('bench') === '1') {
    window.__bench = () => {
      const times = [0.8, 2.4, 8.5, 14.6, 21.0, 26.5, 35.4];
      const out = {};
      for (const ts of times) {
        state.time = ts; state.breathTime = ts;
        // warmup + average 10 frames
        renderFrame(true);
        const t0 = performance.now();
        for (let k = 0; k < 10; k++) { state.time = ts + k * 0.042; state.breathTime = state.time; renderFrame(true); }
        out[`t_${ts}`] = +((performance.now() - t0) / 10).toFixed(2);
      }
      return out;
    };
  }

  if (isInspectMode) {
    hudEl.style.transition = 'none';
    setHudVisibility(false);
    renderFrame(true);
  } else {
    setHudVisibility(true);
    scheduleHudAutoHide();
    syncAudioPlayback(true);
    renderFrame(true);
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
