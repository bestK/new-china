<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A PAPER EPIC / 一纸山河</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, "Times New Roman", serif;
  }

  body.cursor-hidden {
    cursor: none;
  }

  #viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    overflow: hidden;
    background: #14110e;
    transform-origin: center center;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.95);
  }

  #epic-canvas {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    display: block;
  }

  #paper-relief-overlay {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0.24;
    transition: opacity 0.6s ease;
  }

  #lamp-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 92% 86% at 32% 24%, rgba(255, 246, 224, 0.09) 0%, rgba(255, 244, 218, 0.0) 54%, rgba(8, 6, 4, 0.42) 100%);
  }

  /* Minimalist recording-friendly HUD (bottom-left) */
  #hud {
    position: absolute;
    left: 34px;
    bottom: 28px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 15px 9px 12px;
    border-radius: 3px;
    background: rgba(14, 12, 10, 0.72);
    border: 1px solid rgba(235, 214, 174, 0.22);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #efe5cf;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: auto;
  }

  #hud.hud-hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  .hud-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #efe5cf;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 2px;
    opacity: 0.86;
    transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
  }

  .hud-btn:hover {
    opacity: 1;
    background: rgba(239, 229, 207, 0.12);
  }

  .hud-btn.active {
    color: #f0c76e;
    opacity: 1;
  }

  .hud-btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }

  #timeline-wrap {
    position: relative;
    width: 288px;
    height: 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  #timeline-track {
    position: relative;
    width: 100%;
    height: 3px;
    background: rgba(239, 229, 207, 0.22);
    border-radius: 2px;
  }

  #timeline-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d89b42, #f2cc76);
    border-radius: 2px;
  }

  #timeline-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: #f6e7c4;
    box-shadow: 0 0 6px rgba(240, 199, 110, 0.7);
  }

  .chapter-tick {
    position: absolute;
    top: -4px;
    width: 1px;
    height: 11px;
    background: rgba(239, 229, 207, 0.38);
    pointer-events: none;
  }

  #timecode {
    font-family: "Courier New", Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: rgba(239, 229, 207, 0.88);
    min-width: 94px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="epic-canvas" width="1920" height="1080"></canvas>

    <!-- Static GPU-cached SVG paper relief texture (feTurbulence + feDiffuseLighting) -->
    <svg id="paper-relief-overlay" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true">
      <defs>
        <filter id="xuan-paper-relief" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.038 0.044" numOctaves="4" seed="49" result="fiberNoise"/>
          <feDiffuseLighting in="fiberNoise" lighting-color="#fff8e8" surfaceScale="1.9" diffuseConstant="1.08" result="rakingLight">
            <feDistantLight azimuth="225" elevation="50"/>
          </feDiffuseLighting>
          <feColorMatrix type="saturate" values="0.16"/>
        </filter>
      </defs>
      <rect width="1920" height="1080" filter="url(#xuan-paper-relief)"/>
    </svg>

    <div id="lamp-vignette"></div>

    <div id="hud" aria-label="Playback controls">
      <button id="btn-play" class="hud-btn" title="Play / Pause (Space)" aria-label="Play or Pause">
        <svg id="icon-pause" viewBox="0 0 16 16"><rect x="3" y="2.5" width="3.5" height="11" rx="0.6"/><rect x="9.5" y="2.5" width="3.5" height="11" rx="0.6"/></svg>
        <svg id="icon-play" viewBox="0 0 16 16" style="display:none"><polygon points="4,2.2 13.5,8 4,13.8"/></svg>
      </button>
      <button id="btn-replay" class="hud-btn" title="Replay (R)" aria-label="Replay">
        <svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-4.8 2.8l1.4.8A3.9 3.9 0 1 0 8 4.1V6.3L4.4 3.5 8 .8v1.7z"/></svg>
      </button>
      <button id="btn-loop" class="hud-btn" title="Loop (L)" aria-label="Toggle Loop">
        <svg viewBox="0 0 16 16"><path d="M11.6 3.2L14 5.5l-2.4 2.3V6.3H5.2c-.8 0-1.4.6-1.4 1.4v.6H2.3v-.6a2.9 2.9 0 0 1 2.9-2.9h6.4V3.2zm-7.2 9.6L2 10.5l2.4-2.3v1.5h6.4c.8 0 1.4-.6 1.4-1.4v-.6h1.5v.6a2.9 2.9 0 0 1-2.9 2.9H4.4v1.6z"/></svg>
      </button>
      <div id="timeline-wrap" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="36" aria-valuenow="0">
        <div id="timeline-track">
          <div id="timeline-fill"></div>
          <div class="chapter-tick" style="left:16.666%"></div>
          <div class="chapter-tick" style="left:33.333%"></div>
          <div class="chapter-tick" style="left:50%"></div>
          <div class="chapter-tick" style="left:66.666%"></div>
          <div class="chapter-tick" style="left:83.333%"></div>
          <div id="timeline-thumb"></div>
        </div>
      </div>
      <div id="timecode">00:00 / 00:36</div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================================
   * 1. STAGE SCALING & CONSTANTS
   * ========================================================================= */
  const W = 1920;
  const H = 1080;
  const CX = W * 0.5;
  const CY = H * 0.5;
  const FOCAL = 920;
  const TOTAL_DURATION = 36.0;
  const CAM_FPS = 24;
  const STOP_FPS = 12;

  const stageEl = document.getElementById('stage');
  const canvas = document.getElementById('epic-canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reliefEl = document.getElementById('paper-relief-overlay');

  function fitStage() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    stageEl.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  /* =========================================================================
   * 2. DETERMINISTIC HASHING, MATH & COLOR UTILS
   * ========================================================================= */
  function hash32(a, b = 0, c = 0) {
    let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }

  function seededRand(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOutSine = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
  const easeOutBack = t => {
    const c1 = 1.35, c3 = c1 + 1;
    const x = clamp(t, 0, 1) - 1;
    return 1 + c3 * x * x * x + c1 * x * x;
  };

  function lerpColor(c1, c2, t) {
    const k = clamp(t, 0, 1);
    const r = Math.round(lerp(c1[0], c2[0], k));
    const g = Math.round(lerp(c1[1], c2[1], k));
    const b = Math.round(lerp(c1[2], c2[2], k));
    return `rgb(${r},${g},${b})`;
  }

  function rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  /* =========================================================================
   * 3. PROCEDURAL PAPER TEXTURE ATLAS (OFFSCREEN CANVASES)
   * ========================================================================= */
  const PaperAtlas = {};

  function makePatternCanvas(size, drawFn) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    drawFn(g, size);
    return { canvas: c, pattern: ctx.createPattern(c, 'repeat') };
  }

  function addPaperFibers(g, size, rand, count, darkCol, lightCol, grainAlpha = 0.055) {
    // Organic mottled grain
    for (let i = 0; i < count * 2; i++) {
      const x = rand() * size;
      const y = rand() * size;
      const r = 1 + rand() * 3.2;
      g.fillStyle = rand() > 0.5 ? darkCol : lightCol;
      g.globalAlpha = grainAlpha * (0.4 + rand() * 0.9);
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }
    // Fine curving Xuan cellulose fibers
    g.lineWidth = 0.75;
    for (let i = 0; i < count; i++) {
      const x = rand() * size;
      const y = rand() * size;
      const len = 6 + rand() * 18;
      const ang = rand() * Math.PI * 2;
      const cx1 = x + Math.cos(ang + 0.4) * len * 0.5;
      const cy1 = y + Math.sin(ang + 0.4) * len * 0.5;
      const x2 = x + Math.cos(ang) * len;
      const y2 = y + Math.sin(ang) * len;
      g.strokeStyle = rand() > 0.45 ? darkCol : lightCol;
      g.globalAlpha = grainAlpha * (0.7 + rand() * 1.1);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(cx1, cy1, x2, y2);
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  function buildPaperAtlas() {
    // 1. Xuan Ivory Paper (宣纸米黄)
    PaperAtlas.xuan = makePatternCanvas(256, (g, s) => {
      const r = seededRand(101);
      g.fillStyle = '#efe4cc';
      g.fillRect(0, 0, s, s);
      // Warm mottled tea-stain washes
      for (let i = 0; i < 18; i++) {
        const x = r() * s, y = r() * s, rad = 28 + r() * 64;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.5 ? 'rgba(205,180,136,0.14)' : 'rgba(255,250,238,0.16)');
        grd.addColorStop(1, 'rgba(239,228,204,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 160, '#8d7654', '#fffbf0', 0.085);
    });

    // 2. Aged 1949 Broadsheet Newsprint (泛黄旧报纹)
    PaperAtlas.newsprint = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1949);
      g.fillStyle = '#dfd1b3';
      g.fillRect(0, 0, s, s);
      // Foxing patches
      for (let i = 0; i < 22; i++) {
        const x = r() * s, y = r() * s, rad = 18 + r() * 52;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, 'rgba(164,132,84,0.16)');
        grd.addColorStop(1, 'rgba(223,209,179,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      // Subtle column rules & vintage micro-type texture
      g.strokeStyle = 'rgba(54,44,34,0.14)';
      g.lineWidth = 1;
      for (let x = 16; x < s; x += 64) {
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, s); g.stroke();
      }
      g.fillStyle = 'rgba(42,35,28,0.18)';
      for (let col = 0; col < 4; col++) {
        const cx0 = 22 + col * 64;
        for (let row = 6; row < s; row += 8) {
          if (r() < 0.14) continue;
          const w = 36 + r() * 14;
          g.fillRect(cx0, row, w, 2.2);
        }
      }
      addPaperFibers(g, s, r, 150, '#6e5a3e', '#f5ebd6', 0.09);
    });

    // 3. Cinnabar Woodblock Red (朱砂红)
    PaperAtlas.cinnabar = makePatternCanvas(256, (g, s) => {
      const r = seededRand(203);
      g.fillStyle = '#b73226';
      g.fillRect(0, 0, s, s);
      // Woodblock brayer streaks
      for (let i = 0; i < 90; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(130,22,16,0.14)' : 'rgba(232,102,72,0.11)';
        g.fillRect(0, r() * s, s, 1 + r() * 3.5);
      }
      addPaperFibers(g, s, r, 140, '#5d140e', '#f4c7a8', 0.08);
    });

    // 4. Harvest Ochre / Woodcut Gold (复古赭石麦金)
    PaperAtlas.ochre = makePatternCanvas(256, (g, s) => {
      const r = seededRand(304);
      g.fillStyle = '#d4993a';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 45; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(155,96,24,0.12)' : 'rgba(255,228,154,0.14)';
        g.fillRect(r() * s, r() * s, 16 + r() * 48, 2 + r() * 5);
      }
      addPaperFibers(g, s, r, 130, '#7c4c12', '#fff0be', 0.085);
    });

    // 5. Prussian Cyanotype Blueprint (蓝图晒图肌理)
    PaperAtlas.blueprint = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1956);
      g.fillStyle = '#1c3e5b';
      g.fillRect(0, 0, s, s);
      // Cyanotype chemical wash variation
      for (let i = 0; i < 24; i++) {
        const x = r() * s, y = r() * s, rad = 24 + r() * 70;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.45 ? 'rgba(42,98,138,0.22)' : 'rgba(14,32,52,0.22)');
        grd.addColorStop(1, 'rgba(28,62,91,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      // Fine drafting grid
      g.strokeStyle = 'rgba(218,236,248,0.11)';
      g.lineWidth = 0.7;
      for (let i = 0; i < s; i += 16) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke();
      }
      g.strokeStyle = 'rgba(232,245,255,0.23)';
      g.lineWidth = 1;
      for (let i = 0; i < s; i += 64) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke();
      }
      addPaperFibers(g, s, r, 130, '#0c1f30', '#cce5f5', 0.065);
    });

    // 6. Industrial Steel Slate Paper (钢铁灰)
    PaperAtlas.steel = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1958);
      g.fillStyle = '#5b6873';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 70; i++) {
        g.fillStyle = r() > 0.5 ? 'rgba(30,38,46,0.14)' : 'rgba(180,194,206,0.12)';
        g.fillRect(0, r() * s, s, 1 + r() * 3);
      }
      addPaperFibers(g, s, r, 130, '#2a333b', '#ced9e2', 0.075);
    });

    // 7. Oxide Industrial Rust Paper (红砖铁锈)
    PaperAtlas.rust = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1962);
      g.fillStyle = '#994c34';
      g.fillRect(0, 0, s, s);
      addPaperFibers(g, s, r, 140, '#4f2114', '#e3a588', 0.09);
    });

    // 8. Raw Cotton Tissue Paper (棉纸白)
    PaperAtlas.cotton = makePatternCanvas(256, (g, s) => {
      const r = seededRand(405);
      g.fillStyle = '#f6f2e8';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 24; i++) {
        const x = r() * s, y = r() * s, rad = 16 + r() * 44;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, 'rgba(218,208,190,0.18)');
        grd.addColorStop(1, 'rgba(246,242,232,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 180, '#b5a892', '#ffffff', 0.09);
    });

    // 9. Celestial Star-Chart Indigo (星穹深蓝)
    PaperAtlas.cosmic = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1970);
      g.fillStyle = '#0e1e36';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 20; i++) {
        const x = r() * s, y = r() * s, rad = 32 + r() * 75;
        const grd = g.createRadialGradient(x, y, 2, x, y, rad);
        grd.addColorStop(0, r() > 0.5 ? 'rgba(30,66,112,0.22)' : 'rgba(6,13,26,0.26)');
        grd.addColorStop(1, 'rgba(14,30,54,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      }
      addPaperFibers(g, s, r, 120, '#050b16', '#4a709e', 0.065);
    });

    // 10. Hot-Stamped Gold Foil (烫金箔 — seamless tileable)
    PaperAtlas.goldFoil = makePatternCanvas(256, (g, s) => {
      const r = seededRand(777);
      const grd = g.createLinearGradient(0, 0, s, 0);
      grd.addColorStop(0, '#dfb04c');
      grd.addColorStop(0.25, '#f6dc91');
      grd.addColorStop(0.5, '#cf9935');
      grd.addColorStop(0.75, '#f8e3a1');
      grd.addColorStop(1, '#dfb04c');
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 110; i++) {
        g.strokeStyle = r() > 0.5 ? 'rgba(255,250,224,0.16)' : 'rgba(116,74,14,0.12)';
        g.lineWidth = 0.8 + r() * 1.4;
        const y = r() * s;
        g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke();
      }
      addPaperFibers(g, s, r, 70, '#8d5b14', '#fff5d0', 0.06);
    });

    // 11. Brushed Silver Foil (银箔纸 — seamless tileable)
    PaperAtlas.silverFoil = makePatternCanvas(256, (g, s) => {
      const r = seededRand(888);
      const grd = g.createLinearGradient(0, 0, s, 0);
      grd.addColorStop(0, '#cfd8e1');
      grd.addColorStop(0.3, '#edf2f7');
      grd.addColorStop(0.6, '#b7c4d0');
      grd.addColorStop(0.85, '#e5ebf1');
      grd.addColorStop(1, '#cfd8e1');
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
      addPaperFibers(g, s, r, 100, '#6e7c8a', '#ffffff', 0.075);
    });

    // 12. Celadon Mineral Ink-Wash (青绿山水纸 — seamless tileable)
    PaperAtlas.celadon = makePatternCanvas(256, (g, s) => {
      const r = seededRand(2008);
      g.fillStyle = '#2d685e';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 34; i++) {
        const x = r() * s, y = r() * s, rad = 22 + r() * 58;
        const col = r() > 0.45 ? 'rgba(108,176,148,0.18)' : 'rgba(18,48,54,0.20)';
        for (const ox of [-s, 0, s]) {
          for (const oy of [-s, 0, s]) {
            const rg = g.createRadialGradient(x + ox, y + oy, 2, x + ox, y + oy, rad);
            rg.addColorStop(0, col);
            rg.addColorStop(1, 'rgba(45,104,94,0)');
            g.fillStyle = rg;
            g.fillRect(0, 0, s, s);
          }
        }
      }
      addPaperFibers(g, s, r, 150, '#122e30', '#a9d7c3', 0.075);
    });

    // 13. Aged Architectural Vellum (泛黄建筑蓝图纸)
    PaperAtlas.vellum = makePatternCanvas(256, (g, s) => {
      const r = seededRand(1978);
      g.fillStyle = '#eadbbe';
      g.fillRect(0, 0, s, s);

  /* =========================================================================
   * 4. PAPERCRAFT DRAWING PRIMITIVES (DECKLED EDGES, PULP RIMS, ORIGAMI)
   * ========================================================================= */
  function buildDeckledPoints(pts, seed = 1, step = 10, amp = 2.6, closed = true) {
    const out = [];
    const n = pts.length;
    const count = closed ? n : n - 1;
    let idx = 0;
    for (let i = 0; i < count; i++) {
      const p0 = pts[i];
      const p1 = pts[(i + 1) % n];
      const dx = p1[0] - p0[0];
      const dy = p1[1] - p0[1];
      const dist = Math.hypot(dx, dy);
      const segs = Math.max(1, Math.round(dist / step));
      const nx = dist > 0.001 ? -dy / dist : 0;
      const ny = dist > 0.001 ? dx / dist : 0;
      for (let j = 0; j < segs; j++) {
        const f = j / segs;
        const j1 = (hash32(seed, idx++, 11) * 2 - 1) * amp;
        const j2 = (hash32(seed, idx, 23) * 2 - 1) * amp * 0.45;
        const edgePin = (j === 0) ? 0.3 : 1.0;
        out.push([
          p0[0] + dx * f + nx * (j1 + j2) * edgePin,
          p0[1] + dy * f + ny * (j1 + j2) * edgePin
        ]);
      }
    }
    if (!closed && n > 0) out.push(pts[n - 1]);
    return out;
  }

  function tracePoly(g, pts, closed = true) {
    if (!pts.length) return;
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    if (closed) g.closePath();
  }

  function fillDeckledPoly(g, pts, opts = {}) {
    const {
      fill = PaperAtlas.xuan.pattern,
      pulpColor = 'rgba(247, 240, 224, 0.85)',
      pulpWidth = 3.2,
      rimLight = 'rgba(255, 249, 232, 0.28)',
      strokeColor = null,
      strokeWidth = 1.2,
      seed = 7,
      step = 11,
      amp = 2.6,
      tint = null,
      innerShadow = true
    } = opts;

    const dPts = buildDeckledPoints(pts, seed, step, amp, true);

    // 1. Raw torn paper pulp edge (slightly offset toward bottom-right tear reveal)
    if (pulpWidth > 0) {
      g.save();
      tracePoly(g, dPts, true);
      g.strokeStyle = pulpColor;
      g.lineWidth = pulpWidth * 2;
      g.lineJoin = 'round';
      g.stroke();
      g.restore();
    }

    // 2. Main textured paper fill
    g.save();
    tracePoly(g, dPts, true);
    g.fillStyle = fill;
    g.fill();

    if (tint) {
      g.fillStyle = tint;
      g.fill();
    }

    // 3. Subtle warm desk-lamp directional shading inside cutout
    if (innerShadow) {
      g.clip();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of dPts) {
        if (p[0] < minX) minX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] > maxY) maxY = p[1];
      }
      const grd = g.createLinearGradient(minX, minY, maxX, maxY);
      grd.addColorStop(0, 'rgba(255, 248, 228, 0.14)');
      grd.addColorStop(0.5, 'rgba(255, 248, 228, 0.0)');
      grd.addColorStop(1, 'rgba(18, 12, 8, 0.18)');
      g.fillStyle = grd;
      g.fillRect(minX - 4, minY - 4, maxX - minX + 8, maxY - minY + 8);
    }
    g.restore();

    // 4. Lamp-facing rim highlight
    if (rimLight) {
      g.save();
      g.translate(-1, -1);
      tracePoly(g, dPts, true);
      g.strokeStyle = rimLight;
      g.lineWidth = 1.1;
      g.stroke();
      g.restore();
    }

    if (strokeColor) {
      g.save();
      tracePoly(g, dPts, true);
      g.strokeStyle = strokeColor;
      g.lineWidth = strokeWidth;
      g.stroke();
      g.restore();
    }
    return dPts;
  }

  function makeSprite(w, h, drawFn) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    drawFn(g, w, h);
    return c;
  }

    function buildVintageStamp(accentColor, yearLabel, motifFn, seed) {

        g.fillStyle = PaperAtlas.xuan.pattern;
        g.fill();

        g.globalCompositeOperation = 'destination-out';
        const tooth = 18;
        for (let x = pad; x <= w - pad; x += tooth) {
          g.beginPath(); g.arc(x, pad, 5.2, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(x, h - pad, 5.2, 0, Math.PI * 2); g.fill();
        }
        for (let y = pad; y <= h - pad; y += tooth) {
          g.beginPath(); g.arc(pad, y, 5.2, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(w - pad, y, 5.2, 0, Math.PI * 2); g.fill();

        g.restore();

        // Inner colored woodcut print frame
        g.fillStyle = accentColor;
        g.fillRect(36, 38, w - 72, h - 94);
        g.strokeStyle = '#efe3c6';
        g.lineWidth = 2;
        g.strokeRect(42, 44, w - 84, h - 106);

        // Motif illustration inside stamp
        g.save();
        g.beginPath();
        g.rect(42, 44, w - 84, h - 106);
        g.clip();
        motifFn(g, w, h);
        g.restore();

        // Vintage stamp typography (bottom strip)
        g.fillStyle = '#332820';
        g.font = 'bold 20px "Songti SC", "STSong", serif';
        g.fillText(yearLabel, 40, h - 30);
        g.font = 'bold 22px "Courier New", monospace';
        g.fillText('8分', w - 78, h - 30);

        // Ink cancellation postmark circle
        g.save();
        g.strokeStyle = 'rgba(34, 28, 24, 0.45)';
        g.lineWidth = 2;
        g.beginPath(); g.arc(w - 64, 86, 36, 0, Math.PI * 2); g.stroke();
        g.beginPath(); g.arc(w - 64, 86, 26, 0, Math.PI * 2); g.stroke();
        for (let i = 0; i < 4; i++) {
          g.beginPath();
          g.moveTo(w - 130, 74 + i * 8);
          g.quadraticCurveTo(w - 108, 68 + i * 8, w - 92, 74 + i * 8);
          g.stroke();
        }
        g.restore();
      });

          lift += ph * Math.exp(-d * d);

        const undul = Math.sin(x * 0.015) * 9 + Math.cos(x * 0.037) * 5;
        pts.push([x, baseY - lift + undul]);
      }
      return pts;
    }

   * 6. LIVE 12FPS ARTICULATED PAPERCRAFT RENDERERS

  // 12fps Hand-placed Stop-Motion Jitter Helper (±2px, ±0.5°)
  function getStopMotionJitter(pieceId, animFrame, ampScale = 1.0) {
    const jx = (hash32(pieceId, animFrame, 1) * 2 - 1) * 2.0 * ampScale;
    const jy = (hash32(pieceId, animFrame, 2) * 2 - 1) * 2.0 * ampScale;
    const jrot = (hash32(pieceId, animFrame, 3) * 2 - 1) * 0.5 * (Math.PI / 180) * ampScale;
    return { jx, jy, jrot };
  }

  // Dynamic Perspective + Shadow + DOF Wrapper
  function projectWorld(wx, wy, wz, cam) {
    const dz = wz - cam.z;
    if (dz <= 95 || dz >= 4600) return null;
    const scale = FOCAL / dz;
    const sx = CX + (wx - cam.x) * scale;
    const sy = CY + (wy - cam.y) * scale;

    // Far horizon atmospheric fade-in + ultra-close lens pass-out fade
    const farFade = 1 - smoothstep(3200, 4550, dz);
    const nearFade = smoothstep(105, 250, dz);
    const alpha = farFade * nearFade;
    if (alpha <= 0.006) return null;

    // Dynamic upper-left desk-lamp drop shadow proportional to proximity (Z height)
    const closeness = clamp(1 - (dz - 350) / 2800, 0.12, 1.0);
    const shadowX = lerp(4, 24, closeness) * clamp(scale, 0.35, 1.8);
    const shadowY = lerp(6, 30, closeness) * clamp(scale, 0.35, 1.8);
    const shadowBlur = lerp(5, 32, closeness) * clamp(scale, 0.4, 1.6);

    // Subtle optical Depth-of-Field blur for ultra-near foreground cutouts
    const dofBlur = dz < 420 ? clamp((420 - dz) / 55, 0, 5.5) : 0;

    return { sx, sy, scale, dz, alpha, shadowX, shadowY, shadowBlur, dofBlur };
  }

  function renderLayer(item, cam, animFrame, breathScale = 1.0) {
    const p = projectWorld(item.wx, item.wy, item.wz, cam);
    if (!p) return;
    const finalAlpha = p.alpha * (item.alpha ?? 1);
    if (finalAlpha <= 0.008) return;

    const { jx, jy, jrot } = getStopMotionJitter(item.id, animFrame, (item.jitterScale ?? 1.0) * breathScale);

    ctx.save();
    ctx.globalAlpha = finalAlpha;
    if (p.dofBlur >= 0.7 && !item.noDof) {
      ctx.filter = `blur(${(Math.round(p.dofBlur * 2) / 2).toFixed(1)}px)`;
    }

    ctx.translate(p.sx + jx, p.sy + jy);
    ctx.rotate((item.rot ?? 0) + jrot);
    ctx.scale(p.scale * (item.scaleX ?? 1), p.scale * (item.scaleY ?? 1));

    if (!item.noShadow) {
      ctx.shadowColor = item.shadowColor ?? 'rgba(12, 8, 5, 0.42)';
      ctx.shadowOffsetX = p.shadowX;
      ctx.shadowOffsetY = p.shadowY;
      ctx.shadowBlur = p.shadowBlur;
    }

    item.draw(ctx, p);
    ctx.restore();
  }

  // --- Articulated Motif 1: Golden Papercut Wheat Bank (金黄剪纸麦浪) ---
  function drawWheatBank(g, tObj, count, spanW, seed, flipDir = 1) {
    for (let i = 0; i < count; i++) {
      const f = i / (count - 1);
      const bx = (f - 0.5) * spanW;
      const h = 230 + hash32(seed, i, 1) * 145;
      const phase = hash32(seed, i, 2) * Math.PI * 2;
      const sway = Math.sin(tObj * 2.4 + phase) * 26 * flipDir + Math.sin(tObj * 1.1 + f * 5) * 14;

      g.save();
      g.translate(bx, 0);
      // Stalk stem
      g.strokeStyle = '#c4832a';
      g.lineWidth = 4.2;
      g.beginPath();
      g.moveTo(0, 20);
      g.quadraticCurveTo(sway * 0.45, -h * 0.5, sway, -h);
      g.stroke();

      // Golden papercut leaves
      g.fillStyle = PaperAtlas.ochre.pattern;
      g.beginPath();
      g.moveTo(sway * 0.25, -h * 0.32);
      g.quadraticCurveTo(sway * 0.25 + 48 * flipDir, -h * 0.44, sway * 0.25 + 78 * flipDir, -h * 0.22);
      g.quadraticCurveTo(sway * 0.25 + 36 * flipDir, -h * 0.30, sway * 0.25, -h * 0.26);
      g.fill();

      // Serrated wheat ear grains at tip
      const tipX = sway, tipY = -h;
      const angle = Math.atan2(sway * 0.85, h) * 0.7;
      g.translate(tipX, tipY);
      g.rotate(angle);
      for (let k = 0; k < 6; k++) {
        const ky = k * 14 - 4;
        for (const side of [-1, 1]) {
          g.beginPath();
          g.moveTo(0, ky);
          g.lineTo(side * 15, ky - 11);
          g.lineTo(side * 9, ky - 22);
          g.lineTo(0, ky - 9);
          g.closePath();
          g.fillStyle = k % 2 === 0 ? '#e6ad42' : '#cf8d28';
          g.fill();
          g.strokeStyle = '#f9e6b2';
          g.lineWidth = 0.9;
          g.stroke();
        }
      }
      // Fine awns
      g.strokeStyle = '#f4d98d';
      g.lineWidth = 1.1;
      g.beginPath();
      g.moveTo(-5, -18); g.lineTo(-12, -46);
      g.moveTo(0, -22);  g.lineTo(0, -52);
      g.moveTo(5, -18);  g.lineTo(12, -46);
      g.stroke();
      g.restore();
    }
  }

  // --- Articulated Motif 4: Meshed Industrial Paper Gear (工业齿轮) ---
  function drawPaperGear(g, radius, teeth, angle, fillPat, tint) {
    g.save();
    g.rotate(angle);
    const outerR = radius + 16;
    const rootR = radius - 6;
    const innerR = radius * 0.64;
    const hubR = radius * 0.24;

    g.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const da = (Math.PI * 2) / teeth;
      const p1 = a0 + da * 0.14;
      const p2 = a0 + da * 0.34;
      const p3 = a0 + da * 0.64;
      const p4 = a0 + da * 0.84;
      if (i === 0) g.moveTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
      else g.lineTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
      g.lineTo(Math.cos(p1) * outerR, Math.sin(p1) * outerR);
      g.lineTo(Math.cos(p2) * outerR, Math.sin(p2) * outerR);
      g.lineTo(Math.cos(p3) * rootR, Math.sin(p3) * rootR);
      g.lineTo(Math.cos(p4) * rootR, Math.sin(p4) * rootR);
    }
    g.closePath();

    // Punch 6 spoked cutouts inside the gear
    const spokes = 6;
    for (let s = 0; s < spokes; s++) {
      const sa0 = (s / spokes) * Math.PI * 2 + 0.16;
      const sa1 = ((s + 1) / spokes) * Math.PI * 2 - 0.16;
      g.moveTo(Math.cos(sa0) * innerR, Math.sin(sa0) * innerR);
      g.arc(0, 0, innerR, sa0, sa1, false);
      g.lineTo(Math.cos(sa1) * hubR, Math.sin(sa1) * hubR);
      g.arc(0, 0, hubR, sa1, sa0, true);
      g.closePath();
    }
    // Center axle hole
    g.moveTo(hubR * 0.42, 0);
    g.arc(0, 0, hubR * 0.42, 0, Math.PI * 2, true);

    g.fillStyle = fillPat;
    g.fill('evenodd');
    if (tint) {
      g.fillStyle = tint;
      g.fill('evenodd');
    }
    g.strokeStyle = 'rgba(235, 244, 252, 0.55)';
    g.lineWidth = 2.2;
    g.stroke();

    // Rivet dots around rim
    g.fillStyle = 'rgba(236, 224, 196, 0.7)';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      g.beginPath();
      g.arc(Math.cos(a) * (radius * 0.78), Math.sin(a) * (radius * 0.78), 3.4, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }

  // --- Articulated Motif 6: Torn Cotton-Paper Steam Puff (棉纸撕成的白色蒸汽团) ---
  function drawCottonPuff(g, radius, seed) {
    const pts = [];
    const n = 22;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const lobe = 0.86
        + 0.13 * Math.sin(a * 3 + seed)
        + 0.11 * Math.cos(a * 5 + seed * 1.7)
        + (hash32(seed, i, 7) - 0.5) * 0.16;
      pts.push([Math.cos(a) * radius * lobe, Math.sin(a) * radius * lobe * 0.86]);
    }
    fillDeckledPoly(g, pts, {
      fill: PaperAtlas.cotton.pattern,
      pulpColor: 'rgba(255, 255, 255, 0.94)',
      pulpWidth: 4.5,
      seed,
      step: 8,
      amp: 4.2,
      innerShadow: true
    });
  }

  // --- Articulated Motif 7: Dongfanghong-1 Faceted Polyhedron Satellite (东方红一号) ---
  function drawDongfanghong(g, tObj) {
    const R = 64;
    const spin = tObj * 0.9;

    // 4 long slender metallic whip antennas radiating symmetrically
    g.save();
    g.strokeStyle = '#eef4fa';
    g.lineWidth = 3.2;
    for (let i = 0; i < 4; i++) {
      const a = spin * 0.35 + (i * Math.PI * 0.5) + 0.42;
      const len = 178;
      g.beginPath();
      g.moveTo(Math.cos(a) * (R * 0.8), Math.sin(a) * (R * 0.8));
      g.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      g.stroke();
      g.fillStyle = '#f2cc70';
      g.beginPath(); g.arc(Math.cos(a) * len, Math.sin(a) * len, 4.5, 0, Math.PI * 2); g.fill();
    }
    g.restore();

    // 72-hedron geometric silver-foil papercut silhouette (12-gon outer + faceted diamond belts!)
    const outer = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + spin * 0.15;
      outer.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
    g.save();
    tracePoly(g, outer, true);
    g.fillStyle = PaperAtlas.silverFoil.pattern;
    g.fill();
    g.strokeStyle = '#ffffff';
    g.lineWidth = 2.2;
    g.stroke();

    // Internal faceted origami triangles catching studio lamp glints!
    const rings = [0.38, 0.72, 1.0];
    const phaseShift = (spin * 0.6) % (Math.PI / 4);
    for (let col = 0; col < 8; col++) {
      const a0 = -Math.PI * 0.5 + (col / 8) * Math.PI + phaseShift * 0.4;
      const a1 = -Math.PI * 0.5 + ((col + 1) / 8) * Math.PI + phaseShift * 0.4;
      const x0 = Math.sin(a0) * R, x1 = Math.sin(a1) * R;
      for (let row = -2; row < 2; row++) {
        const y0 = (row / 2.2) * R;
        const y1 = ((row + 1) / 2.2) * R;
        const w0 = Math.sqrt(Math.max(0.05, 1 - (y0 / R) ** 2));
        const w1 = Math.sqrt(Math.max(0.05, 1 - (y1 / R) ** 2));
        const shade = ((col + row) % 2 === 0) ? 0.16 : -0.14;
        const lightBoost = (x0 < 0 && y0 < 0) ? 0.24 : 0;
        g.beginPath();
        g.moveTo(x0 * w0, y0);
        g.lineTo(x1 * w0, y0);
        g.lineTo(x1 * w1, y1);
        g.lineTo(x0 * w1, y1);
        g.closePath();
        g.fillStyle = (shade + lightBoost) > 0
          ? `rgba(255,252,240,${(shade + lightBoost).toFixed(2)})`
          : `rgba(22,38,60,${Math.abs(shade).toFixed(2)})`;
        g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.42)';
        g.lineWidth = 1;
        g.stroke();
      }
    }
    // Iconic metallic equatorial belt
    g.fillStyle = PaperAtlas.goldFoil.pattern;
    g.fillRect(-R + 2, -6, (R - 2) * 2, 12);
    g.strokeStyle = '#ffffff';
    g.lineWidth = 1.2;
    g.strokeRect(-R + 2, -6, (R - 2) * 2, 12);
    g.restore();
  }

  // --- Articulated Motif 8: Slewing Tower Crane (塔吊剪影) ---
  function drawTowerCrane(g, tObj, seed, flip = 1) {

    const hoist = 70 + 38 * Math.sin(tObj * 1.4 + seed * 1.7);
    g.save();
    g.scale(flip, 1);
    g.strokeStyle = '#38464d';
    g.lineWidth = 4.5;
    // Vertical lattice mast
    g.strokeRect(-14, -360, 28, 360);
    g.lineWidth = 2.2;
    for (let y = -360; y < 0; y += 28) {
      g.beginPath();
      g.moveTo(-14, y); g.lineTo(14, y + 28);
      g.moveTo(14, y); g.lineTo(-14, y + 28);
      g.stroke();
    }
    // Operator cab
    g.fillStyle = '#d48d36';
    g.fillRect(10, -342, 26, 26);

    // Slewing horizontal jib (foreshortens cleanly as it rotates!)
    const jibLen = 220 * slew;
    const counterLen = 78 * slew;
    g.strokeStyle = '#c45232';
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(-counterLen, -356); g.lineTo(jibLen, -356);
    g.moveTo(-counterLen, -338); g.lineTo(jibLen, -338);
    g.stroke();
    // Peak A-frame & guy cables
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, -408); g.lineTo(jibLen * 0.88, -356);
    g.moveTo(0, -408); g.lineTo(-counterLen, -356);
    g.moveTo(-12, -356); g.lineTo(0, -408); g.lineTo(12, -356);
    g.stroke();
    // Counterweight
    g.fillStyle = '#47545c';
    g.fillRect(-counterLen - 16, -356, 30, 22);

    // Trolley & hoisted paper building block
    const tx = jibLen * 0.68;
    g.strokeStyle = '#2d373d';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(tx, -338); g.lineTo(tx, -338 + hoist); g.stroke();
    fillDeckledPoly(g, [
      [tx - 16, -338 + hoist], [tx + 16, -338 + hoist], [tx + 16, -314 + hoist], [tx - 16, -314 + hoist]
    ], { fill: PaperAtlas.vellum.pattern, pulpWidth: 1, seed: seed + 5, amp: 0.8 });
    g.restore();
  }

  // --- Articulated Motif 9: Scalloped Harbor Paper Waves (海港波浪) ---
  function drawPaperWaveBand(g, width, amp, wavelength, fillPat, tint, seed) {
    const pts = [];
    const steps = 68;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      const x = (f - 0.5) * width;
      const crest = Math.abs(Math.sin(f * Math.PI * (width / wavelength))) * amp;
      pts.push([x, -crest]);
    }
    pts.push([width * 0.5, 190], [-width * 0.5, 190]);
    fillDeckledPoly(g, pts, {
      fill: fillPat,
      tint,
      pulpColor: 'rgba(246, 244, 236, 0.88)',
      pulpWidth: 3.4,
      seed,
      step: 14,
      amp: 2.2
    });
  }

  ];

  function samplePalette(t) {
    for (let i = 0; i < PALETTE_KEYS.length - 1; i++) {
      const a = PALETTE_KEYS[i], b = PALETTE_KEYS[i + 1];
      if (t >= a.t && t <= b.t) {
        const k = easeInOutSine((t - a.t) / (b.t - a.t));
        return {
          top: lerpColor(a.top, b.top, k),
          mid: lerpColor(a.mid, b.mid, k),
          bot: lerpColor(a.bot, b.bot, k),
          relief: lerp(a.relief, b.relief, k),
          starAlpha: lerp(a.starAlpha, b.starAlpha, k)
        };
      }
    }
    const last = PALETTE_KEYS[PALETTE_KEYS.length - 1];
    return {
      top: lerpColor(last.top, last.top, 0),
      mid: lerpColor(last.mid, last.mid, 0),
      bot: lerpColor(last.bot, last.bot, 0),
      relief: last.relief,
      starAlpha: last.starAlpha
    };
  }

  // Smooth Camera Path along Z (36s continuous push-in, easing gently to rest at 36s!)
  function getCamera(tCam) {
    const t = clamp(tCam, 0, TOTAL_DURATION);
    // Linear pace 325 units/s through 0..32.5s, then smooth cubic deceleration to Z=11320 at 36s
    let z;
    if (t <= 32.5) {
      z = t * 325;
    } else {
      const u = (t - 32.5) / 3.5; // 0..1
      // Continuity of derivative: slope at u=0 is 325 * 3.5 = 1137.5; easeOutPoly gives total 757.5
      // Use smooth deceleration integral: v(u) = 325 * (1 - u)^1.65
      // Integral from 0 to u of (1-s)^1.65 ds = (1 - (1-u)^2.65) / 2.65
      z = 32.5 * 325 + 325 * 3.5 * (1 - Math.pow(1 - u, 2.65)) / 2.65;
    }
    // Gentle organic rostrum camera lateral & vertical choreography
    const x = Math.sin(t * 0.36) * 28 - smoothstep(24, 29, t) * 24 + smoothstep(29, 34, t) * 24;
    const y = Math.cos(t * 0.28) * 14
            - smoothstep(11.5, 14.5, t) * 42 + smoothstep(16.8, 19.5, t) * 42
            - smoothstep(29.2, 33.5, t) * 34;
    return { x, y, z };
  }

  function drawBackdrop(pal, tCam, animFrame) {
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, pal.top);
    grd.addColorStop(0.55, pal.mid);
    grd.addColorStop(1, pal.bot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Overlay subtle tiled paper grain onto backdrop itself so sky is real textured paper
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = PaperAtlas.xuan.pattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Soft side-top table lamp illumination pool
    const lamp = ctx.createRadialGradient(W * 0.28, H * 0.16, 40, W * 0.36, H * 0.32, W * 0.85);
    lamp.addColorStop(0, 'rgba(255, 246, 220, 0.16)');
    lamp.addColorStop(0.5, 'rgba(255, 242, 208, 0.04)');
    lamp.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
    ctx.fillStyle = lamp;
    ctx.fillRect(0, 0, W, H);

    // Punched foil stars twinkling at 12fps in cosmic eras
    if (pal.starAlpha > 0.01) {
      ctx.save();
      for (let i = 0; i < BG_STARS.length; i++) {
        const s = BG_STARS[i];
        const tw = 0.45 + 0.55 * Math.sin(animFrame * 0.32 + s.phase);
        ctx.globalAlpha = pal.starAlpha * tw;
        ctx.fillStyle = s.gold ? '#f6d682' : '#eef4fa';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        if (s.r > 2.6) {
          // 4-point star punch glint
          ctx.strokeStyle = ctx.fillStyle;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(s.x - 6, s.y); ctx.lineTo(s.x + 6, s.y);
          ctx.moveTo(s.x, s.y - 6); ctx.lineTo(s.x, s.y + 6);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    const alpha = fadeIn * fadeOut;
    if (alpha <= 0.01) return;

    const { jx, jy, jrot } = getStopMotionJitter(9000 + idx, animFrame, 0.55);
    const slideY = (1 - easeOutCubic(fadeIn)) * 18;

    const styles = {
      light:     { bg: PaperAtlas.xuan.pattern,      ink: '#241b16', year: '#a62c22', border: 'rgba(130, 88, 48, 0.45)' },
      blueprint: { bg: PaperAtlas.vellum.pattern,    ink: '#17324a', year: '#9c452d', border: 'rgba(28, 62, 91, 0.48)' },
      cosmic:    { bg: PaperAtlas.cosmic.pattern,    ink: '#f4ecd8', year: '#ecc264', border: 'rgba(236, 194, 100, 0.55)' },
      vellum:    { bg: PaperAtlas.vellum.pattern,    ink: '#223638', year: '#b84232', border: 'rgba(54, 108, 112, 0.48)' },
      celadon:   { bg: PaperAtlas.xuan.pattern,      ink: '#1c3d3a', year: '#b4352a', border: 'rgba(58, 121, 106, 0.48)' }
    }[ch.theme];

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(64 + jx, 54 + slideY + jy);
    ctx.rotate(jrot * 0.6);

    ctx.shadowColor = 'rgba(8, 6, 4, 0.36)';
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = 7;
    ctx.shadowBlur = 14;

    const tagW = 296, tagH = 88;
    fillDeckledPoly(ctx, [[0, 0], [tagW, 0], [tagW, tagH], [0, tagH]], {
      fill: styles.bg,
      pulpColor: ch.theme === 'cosmic' ? 'rgba(236, 194, 100, 0.45)' : 'rgba(252, 246, 232, 0.88)',
      pulpWidth: 2.2,
      seed: 9100 + idx,
      step: 12,
      amp: 1.6,
      innerShadow: false
    });

    ctx.shadowColor = 'transparent';
    // Inner letterpress hairline border
    ctx.strokeStyle = styles.border;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(8, 8, tagW - 16, tagH - 16);

    // Small red cinnabar registration dot/bar on left
    ctx.fillStyle = styles.year;
    ctx.fillRect(19, 20, 4, 48);

    // Retro letterpress Year
    ctx.fillStyle = styles.year;
    ctx.font = 'bold 17px "Courier New", Consolas, monospace';
    ctx.textBaseline = 'top';
    ctx.fillText(ch.year, 34, 19);

    // Bold Songti lead-type Chinese Chapter Title
    ctx.fillStyle = styles.ink;
    ctx.font = 'bold 31px "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif';
    ctx.fillText(ch.title, 33, 42);

    ctx.restore();
  }

  function drawGrandFinaleTitle(tCam, animFrame) {
    const reveal = smoothstep(31.8, 34.4, tCam);
    if (reveal <= 0.005) return;

    const eased = easeOutCubic(reveal);
    const { jx, jy, jrot } = getStopMotionJitter(9999, animFrame, 0.42);

    ctx.save();
    ctx.globalAlpha = eased;
    ctx.translate(CX + jx, CY - 56 + (1 - eased) * 24 + jy);
    ctx.rotate(jrot * 0.45);

    // Subtle dark celestial halo behind typography for crisp legibility over star trails
    const bgGlow = ctx.createRadialGradient(0, 12, 24, 0, 12, 460);
    bgGlow.addColorStop(0, 'rgba(8, 17, 36, 0.62)');
    bgGlow.addColorStop(0.65, 'rgba(8, 17, 36, 0.24)');
    bgGlow.addColorStop(1, 'rgba(8, 17, 36, 0)');
    ctx.fillStyle = bgGlow;
    ctx.beginPath();
    ctx.ellipse(0, 12, 490, 210, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hot-stamped metallic gold horizontal rules
    const ruleW = 190 * eased;
    ctx.strokeStyle = 'rgba(240, 199, 110, 0.72)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-ruleW - 140, -76); ctx.lineTo(-140, -76);
    ctx.moveTo(140, -76);          ctx.lineTo(ruleW + 140, -76);
    ctx.stroke();

    // Small golden diamond ornament at top center
    ctx.fillStyle = '#f0c76e';
    ctx.beginPath();
    ctx.moveTo(0, -83); ctx.lineTo(6, -76); ctx.lineTo(0, -69); ctx.lineTo(-6, -76);
    ctx.closePath();
    ctx.fill();

    // English Title: A PAPER EPIC (widely tracked vintage gold-foil letterpress)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(4, 10, 22, 0.85)';
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 5;
    ctx.shadowBlur = 14;

    const goldGrad = ctx.createLinearGradient(-260, -40, 260, 40);
    goldGrad.addColorStop(0, '#fae29f');
    goldGrad.addColorStop(0.45, '#e8b957');
    goldGrad.addColorStop(0.75, '#fff0c2');
    goldGrad.addColorStop(1, '#cf9b3a');

    ctx.fillStyle = goldGrad;
    ctx.font = '600 34px Georgia, "Times New Roman", serif';
    drawTrackedText(ctx, 'A PAPER EPIC', 0, -40, 13);

    // Main Chinese Title: 一 纸 山 河 (stately archival ivory-gold woodblock serif)
    ctx.fillStyle = '#f7f0df';
    ctx.font = 'bold 92px "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif';
    drawTrackedText(ctx, '一纸山河', 0, 44, 24);

    // Artisan Cinnabar Red Stamp Seal (山河) cleanly tucked to right of Chinese title
    ctx.save();
    ctx.translate(274, 48);
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#b92e24';
    ctx.fillRect(-20, -24, 40, 48);
    ctx.strokeStyle = '#f5d6b8';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(-16, -20, 32, 40);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#f7ebd8';
    ctx.font = 'bold 16px "Songti SC", "STSong", "SimSun", serif';
    ctx.fillText('山', 0, -9);
    ctx.fillText('河', 0, 11);
    ctx.restore();

    // Lower hairline rule
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(240, 199, 110, 0.52)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-215 * eased, 114);
    ctx.lineTo(215 * eased, 114);
    ctx.stroke();

    // Subtitle: 1949 — PRESENT
    ctx.fillStyle = 'rgba(242, 212, 144, 0.94)';
    ctx.font = '500 22px "Courier New", Consolas, Georgia, serif';
    drawTrackedText(ctx, '1949 — PRESENT', 0, 144, 7);

    ctx.restore();
  }

  function drawTrackedText(g, text, cx0, cy0, tracking) {
    const chars = Array.from(text);
    const widths = chars.map(ch => g.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, chars.length - 1);
    let x = cx0 - total * 0.5;
    for (let i = 0; i < chars.length; i++) {
      g.fillText(chars[i], x + widths[i] * 0.5, cy0);
      x += widths[i] + tracking;
    }
  }

  /* =========================================================================
   * 10. DUAL-FRAMERATE ENGINE (24FPS CAMERA + 12FPS STOP-MOTION) & PLAYBACK
   * ========================================================================= */
  const params = new URLSearchParams(window.location.search);
  const forcedTimeParam = params.has('t') ? parseFloat(params.get('t')) : null;
  const isInspectMode = forcedTimeParam !== null && !Number.isNaN(forcedTimeParam);

  const state = {
    playing: !isInspectMode,
    loop: false,
    time: isInspectMode ? clamp(forcedTimeParam, 0, TOTAL_DURATION) : 0,
    breathTime: isInspectMode ? clamp(forcedTimeParam, 0, TOTAL_DURATION) : 0,
    lastRaf: null,
    lastCamFrame: -1,
    lastAnimFrame: -1,
    hudForceHidden: isInspectMode,
    hudVisible: !isInspectMode,
    idleTimer: null,
    scrubbing: false
  };

  // HUD elements
  const hudEl = document.getElementById('hud');
  const btnPlay = document.getElementById('btn-play');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const btnReplay = document.getElementById('btn-replay');
  const btnLoop = document.getElementById('btn-loop');
  const timelineWrap = document.getElementById('timeline-wrap');
  const timelineFill = document.getElementById('timeline-fill');
  const timelineThumb = document.getElementById('timeline-thumb');
  const timecodeEl = document.getElementById('timecode');

  function formatSec(s) {
    const whole = Math.floor(clamp(s, 0, TOTAL_DURATION));
    return `00:${String(whole).padStart(2, '0')}`;
  }

  function syncHud() {
    const pct = (clamp(state.time, 0, TOTAL_DURATION) / TOTAL_DURATION) * 100;
    timelineFill.style.width = `${pct}%`;
    timelineThumb.style.left = `${pct}%`;
    timecodeEl.textContent = `${formatSec(state.time)} / 00:36`;
    timelineWrap.setAttribute('aria-valuenow', state.time.toFixed(1));
    iconPause.style.display = state.playing ? 'block' : 'none';
    iconPlay.style.display = state.playing ? 'none' : 'block';
    btnLoop.classList.toggle('active', state.loop);
  }

  function setHudVisibility(visible) {
    state.hudVisible = visible;
    hudEl.classList.toggle('hud-hidden', !visible);
    document.body.classList.toggle('cursor-hidden', !visible && !isInspectMode);
  }

  function scheduleHudAutoHide() {
    if (state.idleTimer) clearTimeout(state.idleTimer);
    if (state.hudForceHidden || state.scrubbing) return;
    state.idleTimer = setTimeout(() => {
      if (!state.scrubbing) setHudVisibility(false);
    }, 2000);
  }

  function wakeHud() {
    if (state.hudForceHidden) return;
    setHudVisibility(true);
    scheduleHudAutoHide();
  }

  function togglePlay() {
    if (!state.playing && state.time >= TOTAL_DURATION - 0.01) {
      state.time = 0;
      state.breathTime = 0;
    }
    state.playing = !state.playing;
    state.lastRaf = performance.now();
    syncHud();
    wakeHud();
  }

  function replay() {
    state.time = 0;
    state.breathTime = 0;
    state.playing = true;
    state.lastRaf = performance.now();
    state.lastCamFrame = -1;
    state.lastAnimFrame = -1;
    syncHud();
    wakeHud();
  }

  function toggleHudManual() {
    if (state.hudVisible) {
      state.hudForceHidden = true;
      if (state.idleTimer) clearTimeout(state.idleTimer);
      setHudVisibility(false);
    } else {
      state.hudForceHidden = false;
      setHudVisibility(true);
      scheduleHudAutoHide();
    }
  }

  function toggleLoop() {
    state.loop = !state.loop;
    syncHud();
    wakeHud();
  }

  function seekToClientX(clientX) {
    const rect = timelineWrap.getBoundingClientRect();
    const frac = clamp((clientX - rect.left) / rect.width, 0, 1);
    state.time = frac * TOTAL_DURATION;
    state.breathTime = state.time;
    state.lastCamFrame = -1;
    state.lastAnimFrame = -1;
    syncHud();
    renderFrame(true);
  }

  // Controls & Keyboard Bindings
  btnPlay.addEventListener('click', togglePlay);
  btnReplay.addEventListener('click', replay);
  btnLoop.addEventListener('click', toggleLoop);

  timelineWrap.addEventListener('pointerdown', e => {
    state.scrubbing = true;
    timelineWrap.setPointerCapture(e.pointerId);
    seekToClientX(e.clientX);
    if (state.idleTimer) clearTimeout(state.idleTimer);
  });
  timelineWrap.addEventListener('pointermove', e => {
    if (state.scrubbing) seekToClientX(e.clientX);
  });
  timelineWrap.addEventListener('pointerup', e => {
    if (state.scrubbing) {
      state.scrubbing = false;
      timelineWrap.releasePointerCapture(e.pointerId);
      scheduleHudAutoHide();
    }
  });

  window.addEventListener('mousemove', wakeHud, { passive: true });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      replay();
    } else if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      toggleHudManual();
    } else if (e.key === 'l' || e.key === 'L') {
      e.preventDefault();
      toggleLoop();
    }
  });

  // Main Render Function strictly honoring Dual Clocks:
  //   - Camera Z Push-In & Parallax strictly stepped at 24fps (tCam)
  //   - All Collage Motion & ±2px / ±0.5° Hand-Jitter strictly stepped at 12fps (tObj / animFrame)
  function renderFrame(force = false) {
    const camFrame = Math.floor(state.time * CAM_FPS);
    const animFrame = Math.floor(state.breathTime * STOP_FPS);

    if (!force && camFrame === state.lastCamFrame && animFrame === state.lastAnimFrame) {
      return;
    }
    state.lastCamFrame = camFrame;
    state.lastAnimFrame = animFrame;

    const tCam = Math.min(TOTAL_DURATION, camFrame / CAM_FPS);
    const isHoldingEnd = state.time >= TOTAL_DURATION - 0.001 && !state.loop;
    const tObj = animFrame / STOP_FPS;
    const breathScale = isHoldingEnd ? 0.65 : 1.0;

    const pal = samplePalette(tCam);
    const cam = getCamera(tCam);

    // 1. Textured Paper Backdrop + Desk Lamp + Stars
    drawBackdrop(pal, tCam, animFrame);

    // 2. Depth-Sorted 2.5D Multiplane Papercraft Layers
    const layers = gatherSceneLayers(cam, tCam, tObj, animFrame);
    for (let i = 0; i < layers.length; i++) {
      renderLayer(layers[i], cam, animFrame, breathScale);
    }

    // 3. Chapter Archival Letterpress Stamp (top-left)
    drawChapterCornerTag(tCam, animFrame);

    // 4. Grand Finale Embossed Title (31.8s–36s & living hold)
    drawGrandFinaleTitle(tCam, animFrame);
  }

  function tick(now) {
    if (state.lastRaf === null) state.lastRaf = now;
    const dt = Math.min(0.1, (now - state.lastRaf) / 1000);
    state.lastRaf = now;

    if (state.playing && !state.scrubbing) {
      state.breathTime += dt;
      if (state.time < TOTAL_DURATION) {
        state.time += dt;
        if (state.time >= TOTAL_DURATION) {
          if (state.loop) {
            state.time %= TOTAL_DURATION;
            state.breathTime = state.time;
          } else {
            state.time = TOTAL_DURATION;
            // Stay gently alive at 12fps in the living freeze-frame hold!
          }
        }
        syncHud();
      }
    }

    renderFrame(false);
    requestAnimationFrame(tick);
  }

  /* =========================================================================
   * 11. BOOTSTRAP
   * ========================================================================= */
  buildPaperAtlas();
  buildAllSprites();
  syncHud();

  if (isInspectMode) {
    hudEl.style.transition = 'none';
    setHudVisibility(false);
    renderFrame(true);
  } else {
    setHudVisibility(true);
    scheduleHudAutoHide();
    renderFrame(true);
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
